<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UCC CoDE — BSc IT &amp; BEd IT Student Database</title>
  <meta name="description" content="University of Cape Coast — College of Distance Education, BSc IT & BEd IT Student Group & Assignment Tracker" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Firebase SDK (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel (JSX in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- SheetJS (Excel export) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d1b2a'/><text y='22' x='4' font-size='18' font-weight='bold' fill='%23f0a500' font-family='Arial'>U</text></svg>" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --bg: #07091c;
      --bg2: #0b0e26;
      --bg3: #0f1332;
      --navy: #0a0f1e;
      --navy2: #0f1629;
      --navy3: #141c35;
      --accent: #00d4ff;
      --accent-rgb: 0,212,255;
      --accent2: #8b5cf6;
      --accent2-rgb: 139,92,246;
      --accent3: #06ffa5;
      --accent3-rgb: 6,255,165;
      --accent-dim: rgba(0,212,255,0.1);
      --accent-glow: rgba(0,212,255,0.25);
      --teal: #00d4ff;
      --teal-dim: rgba(0,212,255,0.1);
      --gold: #f0a500;
      --gold-dim: rgba(240,165,0,0.12);
      --light: #f0f4f8;
      --white: #ffffff;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.18);
      --text: #edf2ff;
      --text2: #8a9cc0;
      --text3: #455070;
      --sub: #8a9cc0;
      --green: #06ffa5;
      --red: #f04060;
      --warning: #f0a020;
      --glass: rgba(7,9,28,0.72);
      --glass-border: rgba(255,255,255,0.09);
      --surface: rgba(255,255,255,0.045);
      --surface2: rgba(255,255,255,0.09);
      --surface-solid: #111637;
      --shadow: 0 8px 32px rgba(0,0,0,0.5);
      --shadow-lg: 0 24px 64px rgba(0,0,0,0.6);
      --card-hover-glow: rgba(0,212,255,0.08);
    }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background 0.35s ease, color 0.35s ease; }
    button { cursor: pointer; font-family: var(--font); }
    input, select, textarea { font-family: var(--font); }
    ::selection { background: rgba(0,212,255,0.3); }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }

    /* ── BACKGROUND EFFECTS ── */
    .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bg-orb { position: absolute; border-radius: 50%; filter: blur(80px); }
    .bg-orb-1 { width: 700px; height: 700px; top: -250px; right: -150px; background: radial-gradient(circle, rgba(var(--accent-rgb),0.07) 0%, transparent 70%); }
    .bg-orb-2 { width: 600px; height: 600px; bottom: -200px; left: -150px; background: radial-gradient(circle, rgba(var(--accent2-rgb),0.07) 0%, transparent 70%); }
    .bg-orb-3 { width: 400px; height: 400px; top: 50%; left: 40%; transform: translate(-50%,-50%); background: radial-gradient(circle, rgba(var(--accent-rgb),0.05) 0%, transparent 70%); opacity: 0.5; }
    .bg-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0; background-image: linear-gradient(rgba(var(--accent-rgb),0.018) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--accent-rgb),0.018) 1px, transparent 1px); background-size: 60px 60px; }

    /* ── ENTRANCE ANIMATIONS ── */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.85); } }
    @keyframes shimmer { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .anim-fade { animation: fadeIn 0.5s ease both; }
    .anim-slide { animation: slideUp 0.5s ease both; }
    .anim-slide-fast { animation: slideUp 0.35s ease both; }
    .anim-scale { animation: scaleIn 0.4s ease both; }
    .stagger-1 { animation-delay: 0.05s; }
    .stagger-2 { animation-delay: 0.1s; }
    .stagger-3 { animation-delay: 0.15s; }
    .stagger-4 { animation-delay: 0.2s; }
    .stagger-5 { animation-delay: 0.25s; }

    /* ── LAYOUT ── */
    #root { display: flex; flex-direction: column; min-height: 100vh; position: relative; z-index: 1; }
    .hdr { position: sticky; top: 0; z-index: 100; background: rgba(7,9,28,0.88); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border-bottom: 1px solid var(--glass-border); transition: background 0.35s, border-color 0.35s, box-shadow 0.3s; }
    .hdr.scrolled { box-shadow: var(--shadow); border-color: rgba(255,255,255,0.12); }
    .hdr-inner { max-width: 1280px; margin: 0 auto; padding: 0 28px; height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .stripe { height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent)); }
    .logo { display: flex; align-items: center; gap: 14px; text-decoration: none; flex-shrink: 0; }
    .logo-mk { background: linear-gradient(135deg, rgba(var(--accent-rgb),0.2), rgba(var(--accent2-rgb),0.2)); color: var(--accent); font-weight: 900; font-size: 13px; padding: 8px 11px; border-radius: 10px; letter-spacing: 1px; font-family: var(--mono); border: 1px solid rgba(var(--accent-rgb),0.15); }
    .logo-title { color: #fff; font-weight: 800; font-size: 16px; line-height: 1.2; letter-spacing: -0.03em; }
    .logo-sub { color: var(--text3); font-size: 10px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
    nav { display: flex; align-items: center; gap: 4px; }
    .nav-btn { background: transparent; border: 1px solid transparent; color: var(--text2); padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; transition: all 0.2s; display: inline-flex; align-items: center; gap: 7px; }
    .nav-btn:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }
    .nav-btn.on { background: var(--accent-dim); color: var(--accent); border-color: rgba(var(--accent-rgb),0.2); font-weight: 700; }
    .logout-btn { background: transparent; border: 1px solid rgba(var(--red),0.3); color: var(--red); padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 600; transition: all 0.2s; }
    .logout-btn:hover { background: rgba(240,64,96,0.1); }
    .hamburger { display: none; background: none; border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 10px; align-items: center; justify-content: center; font-size: 20px; transition: all 0.2s; }
    .hamburger:hover { border-color: var(--border2); background: var(--surface2); }
    .mobile-nav { display: none; position: absolute; top: 68px; left: 0; right: 0; background: rgba(7,9,28,0.96); backdrop-filter: blur(24px); border-bottom: 1px solid var(--glass-border); padding: 12px 20px; z-index: 99; }
    .mobile-nav.open { display: flex; flex-direction: column; gap: 4px; animation: slideUp 0.25s ease; }
    .mobile-nav .nav-btn { width: 100%; justify-content: flex-start; padding: 12px 14px; font-size: 15px; border-radius: 10px; }
    .mobile-nav .logout-btn { width: 100%; justify-content: center; margin-top: 8px; }
    main { max-width: 1280px; margin: 0 auto; padding: 36px 28px; flex: 1; width: 100%; position: relative; z-index: 1; }
    footer { text-align: center; padding: 24px; color: var(--text3); font-size: 12px; font-family: var(--mono); border-top: 1px solid var(--border); margin-top: 40px; position: relative; z-index: 1; }
    footer .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; animation: pulse 2.2s ease-in-out infinite; }
    footer .status-dot.on { background: var(--accent3); box-shadow: 0 0 8px rgba(var(--accent3-rgb),0.5); }
    footer .status-dot.off { background: var(--gold); box-shadow: 0 0 8px rgba(240,165,0,0.5); }

    /* ── TYPOGRAPHY ── */
    h1 { font-size: 28px; color: var(--text); font-weight: 800; letter-spacing: -0.03em; }
    .gradient-text { background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 60%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .lead { color: var(--text2); font-size: 13px; font-family: var(--font); margin-top: 6px; line-height: 1.6; }
    .eyebrow { font-size: 11px; color: var(--accent); font-family: var(--mono); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; display: inline-block; }

    /* ── CONTROLS ── */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .search-wrap { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 14px; color: var(--text3); transition: border-color 0.2s; }
    .search-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.1); }
    .search-wrap svg { flex-shrink: 0; }
    .search-input { flex: 1; border: none; outline: none; padding: 10px 0; font-size: 14px; background: transparent; color: var(--text); }
    .search-input::placeholder { color: var(--text3); }
    .x-small { background: none; border: none; font-size: 15px; color: var(--text3); padding: 0 2px; transition: color 0.2s; }
    .x-small:hover { color: var(--text); }
    select.sel { padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font-size: 13px; transition: border-color 0.2s; }
    select.sel:focus { border-color: var(--accent); outline: none; }
    select.sel option { background: var(--bg2); color: var(--text); }

    /* ── BUTTONS ── */
    .btn-print  { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 9px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; transition: all 0.25s; }
    .btn-print:hover { border-color: var(--border2); background: var(--surface2); transform: translateY(-1px); }
    .btn-excel  { background: rgba(var(--accent3-rgb),0.08); border: 1px solid rgba(var(--accent3-rgb),0.2); color: var(--accent3); padding: 10px 16px; border-radius: 9px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; transition: all 0.25s; }
    .btn-excel:hover { background: rgba(var(--accent3-rgb),0.15); transform: translateY(-1px); }
    .btn-import { background: rgba(240,165,0,0.08); border: 1px solid rgba(240,165,0,0.2); color: var(--gold); padding: 10px 16px; border-radius: 9px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; transition: all 0.25s; }
    .btn-import:hover { background: rgba(240,165,0,0.15); transform: translateY(-1px); }
    .btn-seed { background: linear-gradient(135deg, var(--accent2), #6d28d9); color: #fff; border: none; padding: 10px 16px; border-radius: 9px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; transition: all 0.25s; box-shadow: 0 4px 16px rgba(var(--accent2-rgb),0.3); }
    .btn-seed:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(var(--accent2-rgb),0.4); }
    .btn-add { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none; padding: 10px 20px; border-radius: 9px; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; transition: all 0.25s; box-shadow: 0 4px 20px rgba(var(--accent-rgb),0.3); }
    .btn-add:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(var(--accent-rgb),0.4); }
    .btn-save { background: linear-gradient(135deg, var(--accent), #0099cc); color: #fff; border: none; padding: 11px 24px; border-radius: 9px; font-size: 14px; font-weight: 700; transition: all 0.25s; box-shadow: 0 4px 16px rgba(var(--accent-rgb),0.3); }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(var(--accent-rgb),0.4); }
    .btn-save:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-cancel { background: var(--surface); border: 1px solid var(--border); padding: 10px 18px; border-radius: 9px; font-size: 14px; color: var(--text); transition: all 0.2s; }
    .btn-cancel:hover { border-color: var(--border2); background: var(--surface2); }
    .btn-edit { background: var(--accent-dim); border: none; color: var(--accent); padding: 7px 10px; border-radius: 7px; transition: all 0.2s; }
    .btn-edit:hover { background: rgba(var(--accent-rgb),0.2); }
    .btn-del { background: rgba(240,64,96,0.08); border: none; color: var(--red); padding: 7px 10px; border-radius: 7px; transition: all 0.2s; }
    .btn-del:hover { background: rgba(240,64,96,0.15); }

    /* ── TABLE ── */
    .tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 20px; backdrop-filter: blur(12px); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead tr { background: var(--bg2); }
    th { color: var(--text2); padding: 11px 16px; text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; font-family: var(--mono); }
    td { padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr.even td { background: rgba(255,255,255,0.02); }
    tr:hover td { background: var(--surface2); }
    .grp-badge { background: var(--accent-dim); color: var(--accent); padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; font-family: var(--mono); }
    .grp-hdr td { background: var(--bg2); color: var(--text); font-weight: 700; font-size: 12px; letter-spacing: 0.05px; }
    .dash { color: var(--text3); }

    /* ── CARDS ── */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: all 0.25s; position: relative; }
    .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), transparent); opacity: 0; transition: opacity 0.25s; }
    .card:hover { border-color: var(--border2); transform: translateY(-3px); box-shadow: 0 8px 32px var(--card-hover-glow), 0 2px 8px rgba(0,0,0,0.2); }
    .card:hover::before { opacity: 1; }
    .card-hdr { display: flex; align-items: center; gap: 14px; padding: 16px 18px; cursor: pointer; }
    .avatar { width: 42px; height: 42px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; font-family: var(--mono); }
    .card-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
    .card-sub { color: var(--text2); font-size: 12px; margin-top: 2px; }
    .card-body { padding: 0 18px 16px; border-top: 1px solid var(--border); }
    .chip { margin: 10px 0 0; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; transition: border-color 0.2s; }
    .chip:hover { border-color: var(--border2); }
    .chip-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .chip-course { font-weight: 700; font-size: 13px; color: var(--text); }
    .chip-code { font-size: 10px; color: var(--text3); font-family: var(--mono); }
    .chip-grp { background: var(--accent-dim); color: var(--accent); font-size: 11px; padding: 3px 10px; border-radius: 6px; font-weight: 700; margin-left: auto; font-family: var(--mono); }
    .chip-topic { font-size: 12px; color: var(--text2); font-style: italic; margin-top: 4px; }

    /* ── COURSE TABS ── */
    .course-tabs-wrap { overflow-x: auto; margin-bottom: 20px; }
    .course-tabs { display: flex; gap: 6px; min-width: max-content; }
    .c-tab { background: var(--surface); border: 1px solid var(--border); padding: 11px 18px; border-radius: 10px; font-size: 13px; color: var(--text2); display: flex; flex-direction: column; align-items: flex-start; gap: 3px; transition: all 0.2s; }
    .c-tab:hover { border-color: var(--border2); background: var(--surface2); }
    .c-tab.on { background: var(--accent-dim); color: var(--accent); border-color: rgba(var(--accent-rgb),0.2); }
    .c-tab-code { font-size: 10px; opacity: 0.7; font-family: var(--mono); }
    .badge { background: var(--surface2); color: var(--text2); font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 700; font-family: var(--mono); }
    .c-tab.on .badge { background: rgba(var(--accent-rgb),0.2); color: var(--accent); }

    /* ── MODAL ── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; animation: fadeIn 0.2s ease; }
    .modal { background: var(--surface-solid); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 640px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-lg); animation: scaleIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    .modal::before { content: ""; display: block; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .modal-head { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
    .x-btn { background: none; border: none; font-size: 18px; color: var(--text3); transition: color 0.2s; }
    .x-btn:hover { color: var(--text); }
    .m-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 24px; }
    .m-tab { background: none; border: none; padding: 12px 18px; font-size: 13px; color: var(--text3); border-bottom: 2px solid transparent; transition: all 0.2s; }
    .m-tab:hover { color: var(--text2); }
    .m-tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
    .modal-body { padding: 24px; overflow-y: auto; flex: 1; }
    .modal-foot { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

    /* ── FORMS ── */
    .form-stack { display: flex; flex-direction: column; gap: 12px; }
    label.lbl { font-weight: 600; font-size: 13px; color: var(--text); font-family: var(--font); }
    .inp { padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; color: var(--text); background: var(--surface); width: 100%; transition: border-color 0.2s, box-shadow 0.2s; }
    .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.1); }
    .inp::placeholder { color: var(--text3); }
    .sm-inp { font-size: 13px; padding: 8px 12px; }
    .c-row { border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 14px; }
    .c-label { font-size: 13px; color: var(--text); margin-bottom: 8px; }
    .c-fields { display: flex; gap: 12px; flex-wrap: wrap; }
    .f-tag { display: block; font-size: 10px; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--mono); font-weight: 700; }

    /* ── LOGIN ── */
    .login-wrap { display: flex; justify-content: center; padding-top: 80px; position: relative; z-index: 1; }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 44px 40px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 16px; backdrop-filter: blur(20px); box-shadow: var(--shadow-lg); animation: scaleIn 0.4s cubic-bezier(0.34,1.56,0.64,1); position: relative; overflow: hidden; }
    .login-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
    .login-card .grid-bg { position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(var(--accent2-rgb),0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--accent2-rgb),0.03) 1px, transparent 1px); background-size: 40px 40px; }

    /* ── MISC ── */
    .empty { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 15px; }
    .stat { color: var(--text2); font-size: 13px; margin-bottom: 14px; }
    .err { color: var(--red); font-size: 12px; text-align: center; }
    .admin-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .admin-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .cv-controls { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .saving-toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface-solid); color: var(--text); padding: 12px 20px; border-radius: 12px; font-size: 13px; z-index: 9999; box-shadow: var(--shadow); border: 1px solid var(--border); animation: slideUp 0.3s ease; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
    .badge-ok { color: var(--accent3); font-size: 12px; font-weight: 700; font-family: var(--mono); }
    .badge-warn { color: var(--warning); font-size: 12px; font-weight: 700; font-family: var(--mono); }

    /* CONFIG NOTICE */
    .config-notice { background: rgba(240,165,0,0.08); border: 1px solid rgba(240,165,0,0.2); border-radius: 14px; padding: 20px 24px; margin-bottom: 24px; }
    .config-notice h3 { color: var(--gold); margin-bottom: 8px; font-size: 15px; }
    .config-notice p { color: var(--text2); font-size: 13px; line-height: 1.6; }
    .config-notice code { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 12px; font-family: var(--mono); }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      nav { display: none; }
      .hamburger { display: flex; }
    }
    @media (max-width: 768px) {
      main { padding: 24px 16px; }
      .hdr-inner { padding: 0 16px; }
      h1 { font-size: 22px; }
      .card-grid { grid-template-columns: 1fr; }
      .stat-cards { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      main { padding: 16px 12px; }
      h1 { font-size: 20px; }
      .stat-cards { grid-template-columns: 1fr; }
      .admin-btns { flex-direction: column; }
      .admin-btns button { width: 100%; justify-content: center; }
    }

    /* ── ADMIN INNER TABS ── */
    .admin-inner-tabs { display: flex; gap: 0; margin-bottom: 28px; border-bottom: 2px solid var(--border); flex-wrap: wrap; }
    .ai-tab { background: none; border: none; padding: 12px 20px; font-size: 13px; color: var(--text3); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; transition: all 0.2s; }
    .ai-tab:hover { color: var(--text2); }
    .ai-tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

    /* ── DASHBOARD ── */
    .stat-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px 20px; position: relative; overflow: hidden; transition: all 0.25s; }
    .stat-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 8px 24px var(--card-hover-glow); }
    .stat-card::before { content: ""; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
    .stat-card.s-gold::before { background: var(--gold); }
    .stat-card.s-green::before { background: var(--accent3); }
    .stat-card.s-purple::before { background: var(--accent2); }
    .stat-card.s-red::before { background: var(--red); }
    .stat-num { font-size: 36px; font-weight: 900; color: var(--text); line-height: 1; margin-bottom: 6px; font-family: var(--mono); }
    .stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--mono); font-weight: 700; }
    .dash-section { margin-bottom: 28px; }
    .dash-section h3 { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; font-family: var(--mono); font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 12px; }
    .bar-label { width: 130px; flex-shrink: 0; color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-size: 11px; }
    .bar-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #0099cc); border-radius: 4px; transition: width 0.6s ease; min-width: 2px; }
    .bar-fill.alt { background: linear-gradient(90deg, var(--accent2), var(--accent)); }
    .bar-val { width: 55px; text-align: right; color: var(--text2); flex-shrink: 0; font-family: var(--mono); font-weight: 700; font-size: 12px; }
    .bar-extra { width: 65px; color: var(--text3); opacity: 0.7; flex-shrink: 0; font-size: 11px; font-family: var(--mono); }

    /* ── GROUPS MANAGER ── */
    .groups-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
    .groups-meta { display: flex; gap: 18px; margin-bottom: 14px; font-size: 12px; color: var(--text2); }
    .meta-pill { padding: 4px 12px; border-radius: 12px; background: var(--surface); font-weight: 700; font-family: var(--mono); font-size: 11px; }
    .meta-pill.warn { background: rgba(240,165,0,0.1); color: var(--gold); }
    .meta-pill.bad { background: rgba(240,64,96,0.1); color: var(--red); }
    .groups-list { display: flex; flex-direction: column; gap: 8px; }
    .group-row { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; transition: border-color 0.2s; }
    .group-row:hover { border-color: var(--border2); }
    .group-row-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .group-num-badge { background: var(--bg2); color: var(--text); padding: 5px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; white-space: nowrap; min-width: 70px; text-align: center; font-family: var(--mono); border: 1px solid var(--border); }
    .group-topic-area { flex: 1; min-width: 180px; }
    .topic-view-row { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px 10px; border-radius: 8px; border: 1px solid transparent; transition: all 0.15s; }
    .topic-view-row:hover { background: var(--surface2); border-color: var(--border); }
    .g-topic { font-size: 14px; color: var(--text); }
    .no-topic { color: var(--text3); font-size: 13px; font-style: italic; }
    .edit-hint { font-size: 12px; opacity: 0.4; margin-left: auto; }
    .topic-edit-row { display: flex; align-items: center; gap: 8px; }
    .btn-sm { padding: 7px 14px; border-radius: 8px; font-size: 12px; border: none; cursor: pointer; font-weight: 700; transition: all 0.2s; }
    .btn-sm.s { background: var(--accent); color: #fff; }
    .btn-sm.s:hover { background: #0099cc; }
    .btn-sm.c { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .btn-sm.c:hover { background: var(--surface2); }
    .group-cnt { color: var(--text3); font-size: 12px; white-space: nowrap; margin-left: auto; font-family: var(--mono); }
    .toggle-members { background: none; border: 1px solid var(--border); color: var(--text3); font-size: 11px; padding: 4px 10px; border-radius: 6px; margin-top: 10px; transition: all 0.2s; }
    .toggle-members:hover { border-color: var(--border2); color: var(--text2); }
    .member-list { list-style: none; padding: 10px 0 0; display: flex; flex-direction: column; gap: 4px; }
    .member-list li { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 5px 10px; background: var(--surface); border-radius: 6px; }
    .m-idx { color: var(--text3); font-size: 11px; font-family: var(--mono); }

    /* ── WIZARD ── */
    .wizard-tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 18px; }
    .wizard-tool { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 22px; cursor: pointer; transition: all 0.25s; text-align: center; }
    .wizard-tool:hover { border-color: var(--accent); box-shadow: 0 8px 32px rgba(var(--accent-rgb),0.1); transform: translateY(-3px); }
    .tool-icon { font-size: 34px; margin-bottom: 12px; }
    .tool-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.01em; }
    .tool-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }
    .wiz-shell { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; backdrop-filter: blur(12px); }
    .wiz-hdr { background: var(--bg2); padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .wiz-title { font-size: 16px; font-weight: 700; }
    .wiz-back { background: transparent; border: 1px solid var(--border2); color: var(--text2); padding: 7px 14px; border-radius: 8px; font-size: 12px; transition: all 0.2s; }
    .wiz-back:hover { background: var(--surface2); color: var(--text); }
    .wiz-body { padding: 28px; }
    .step-bar { display: flex; gap: 6px; margin-bottom: 24px; align-items: center; }
    .s-dot { width: 28px; height: 28px; border-radius: 50%; background: var(--surface2); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text3); flex-shrink: 0; font-family: var(--mono); transition: all 0.3s; }
    .s-dot.done { background: var(--accent3); border-color: var(--accent3); color: #fff; }
    .s-dot.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .s-line { flex: 1; height: 2px; background: var(--border); transition: background 0.3s; }
    .s-line.done { background: var(--accent3); }
    .pick-list { display: flex; flex-direction: column; gap: 5px; max-height: 280px; overflow-y: auto; margin-top: 10px; padding-right: 4px; }
    .pick-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 13px; transition: all 0.15s; background: var(--surface); }
    .pick-item:hover { background: var(--surface2); border-color: var(--border2); }
    .pick-item.sel { background: var(--accent-dim); border-color: rgba(var(--accent-rgb),0.2); }
    .pick-name { font-weight: 600; flex: 1; }
    .pick-idx { color: var(--text3); font-size: 11px; font-family: var(--mono); }
    .wiz-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border); }
    .btn-next { background: linear-gradient(135deg, var(--accent), #0099cc); color: #fff; border: none; padding: 11px 26px; border-radius: 10px; font-size: 14px; font-weight: 700; transition: all 0.25s; box-shadow: 0 4px 16px rgba(var(--accent-rgb),0.3); }
    .btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(var(--accent-rgb),0.4); }
    .btn-next:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .success-box { text-align: center; padding: 44px 20px; }
    .s-icon { font-size: 56px; margin-bottom: 14px; }
    .s-msg { font-size: 20px; font-weight: 700; color: var(--accent3); margin-bottom: 8px; letter-spacing: -0.01em; }
    .s-sub { color: var(--text2); font-size: 13px; }
    .bulk-topic-grid { display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; margin-top: 12px; }
    .bt-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
    .bt-grp { background: var(--bg2); color: var(--text); padding: 4px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; min-width: 65px; text-align: center; font-family: var(--mono); border: 1px solid var(--border); }
    .bt-inp { flex: 1; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--surface); outline: none; color: var(--text); transition: border-color 0.2s; }
    .bt-inp:focus { border-color: var(--accent); }
    .bt-cnt { color: var(--text3); font-size: 11px; white-space: nowrap; font-family: var(--mono); }

    /* ── SETTINGS ── */
    .settings-page { max-width: 700px; }
    .set-sec { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 16px; }
    .set-sec h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .set-sec .s-desc { font-size: 12px; color: var(--text2); margin-bottom: 18px; line-height: 1.6; }
    .set-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 14px; flex-wrap: wrap; }
    .set-row:last-child { border-bottom: none; padding-bottom: 0; }
    .set-lbl { font-size: 13px; font-weight: 600; }
    .set-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .color-preview { width: 36px; height: 36px; border-radius: 8px; border: 2px solid var(--border); }
    .color-row { display: flex; align-items: center; gap: 10px; }
    .set-danger { background: rgba(240,64,96,0.05); border-color: rgba(240,64,96,0.2); }
    .set-danger h3 { color: var(--red); }
    .btn-danger { background: var(--red); color: #fff; border: none; padding: 10px 18px; border-radius: 9px; font-size: 13px; font-weight: 700; transition: all 0.2s; }
    .btn-danger:hover { opacity: 0.9; transform: translateY(-1px); }
    .pwd-fields { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .set-save-row { display: flex; justify-content: flex-end; padding-top: 14px; border-top: 1px solid var(--border); margin-top: 16px; }
    .msg-ok { color: var(--accent3); font-size: 12px; margin-top: 6px; }
    .msg-err { color: var(--red); font-size: 12px; margin-top: 6px; }
    .preview-hdr { background: var(--bg2); padding: 12px 18px; border-radius: 10px; display: flex; align-items: center; gap: 12px; margin-top: 14px; border: 1px solid var(--border); }
    .preview-mk { padding: 5px 8px; border-radius: 6px; font-size: 11px; font-weight: 900; font-family: var(--mono); }
    .preview-title { font-size: 14px; font-weight: 700; }
    .preview-sub { color: var(--text2); font-size: 11px; }

    /* ── REP BOARD ── */
    .rep-board { background: linear-gradient(135deg, var(--bg2), var(--bg3)); border: 1px solid var(--border); border-radius: 16px; padding: 24px 28px; margin-bottom: 28px; }
    .rep-board-title { color: var(--gold); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 18px; font-family: var(--mono); }
    .rep-cards-row { display: flex; gap: 14px; flex-wrap: wrap; }
    .rep-card { background: var(--surface); border: 1px solid var(--glass-border); border-radius: 14px; padding: 18px; display: flex; align-items: flex-start; gap: 14px; min-width: 250px; max-width: 320px; flex: 1; cursor: pointer; transition: all 0.25s; }
    .rep-card:hover { background: var(--surface2); border-color: var(--gold); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(240,165,0,0.1); }
    .rep-av { width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, var(--gold), #e6950a); color: var(--navy); font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: var(--mono); }
    .rep-info { flex: 1; min-width: 0; }
    .rep-name { color: var(--text); font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .rep-badge { background: var(--gold-dim); color: var(--gold); font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 6px; display: inline-block; margin-bottom: 6px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05px; }
    .rep-prog { color: var(--text2); font-size: 11px; margin-bottom: 6px; }
    .rep-contacts { display: flex; flex-direction: column; gap: 4px; }
    .rep-link { color: var(--accent); font-size: 11px; text-decoration: none; transition: color 0.2s; }
    .rep-link:hover { color: var(--gold); }
    .rep-wa { background: #25d366; color: #fff; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 6px; text-decoration: none; display: inline-block; margin-top: 4px; transition: opacity 0.2s; }
    .rep-wa:hover { opacity: 0.85; }

    /* ── STUDENT CARD additions ── */
    .card-contacts { display: flex; gap: 10px; flex-wrap: wrap; padding: 8px 18px 0; }
    .cc-link { color: var(--accent); font-size: 11px; text-decoration: none; transition: color 0.2s; }
    .cc-link:hover { color: var(--gold); }
    .wa-btn { background: #25D366; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; transition: all 0.2s; }
    .wa-btn:hover { background: #1da855; transform: translateY(-1px); }
    .wa-btn.sm { padding: 4px 10px; font-size: 10px; }
    .wa-btn.outline { background: transparent; border: 1px solid #25D366; color: #25D366; }
    .wa-btn.outline:hover { background: rgba(37,211,102,0.1); }

    /* ── REPS SECTION ── */
    .reps-section { margin-bottom: 28px; }
    .reps-section-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .reps-section-hdr h2 { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: -0.02em; }
    .reps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .role-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--gold-dim); color: var(--gold); font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.03px; font-family: var(--mono); }
    .grp-hdr-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }

    /* ── SETTINGS: COURSES / WHATSAPP ── */
    .edit-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
    .edit-table th { text-align: left; padding: 9px 12px; font-size: 10px; color: var(--text3); text-transform: uppercase; border-bottom: 2px solid var(--border); font-family: var(--mono); font-weight: 700; letter-spacing: 0.08em; }
    .edit-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .edit-table tr:last-child td { border-bottom: none; }
    .et-inp { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; background: var(--surface); outline: none; color: var(--text); transition: border-color 0.2s; }
    .et-inp:focus { border-color: var(--accent); }
    .et-btn-add { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 12px; transition: all 0.2s; }
    .et-btn-add:hover { background: #0099cc; }
    .et-btn-del { background: none; border: none; color: var(--red); font-size: 16px; cursor: pointer; padding: 0 4px; transition: opacity 0.2s; }
    .et-btn-del:hover { opacity: 0.7; }
    .wa-inp-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .wa-inp-row:last-child { border-bottom: none; }
    .wa-inp-label { font-size: 12px; font-weight: 600; color: var(--text); min-width: 120px; flex-shrink: 0; }
    .wa-inp { flex: 1; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; background: var(--surface); outline: none; color: var(--text); transition: border-color 0.2s; }
    .wa-inp:focus { border-color: #25D366; }
    .wa-inp.filled { border-color: #25D366; background: rgba(37,211,102,0.05); }
    .wa-sec-hdr { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin: 16px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 6px; font-family: var(--mono); }

    /* ── NOTICEBOARD ── */
    .nb-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .nb-grid { display: flex; flex-direction: column; gap: 14px; }
    .nb-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: all 0.25s; }
    .nb-card:hover { box-shadow: 0 8px 32px var(--card-hover-glow); border-color: var(--border2); }
    .nb-card.pinned { border-left: 4px solid var(--gold); }
    .nb-card.urgent { border-left: 4px solid var(--red); }
    .nb-card.info { border-left: 4px solid var(--accent); }

function printTable(html, title) {
  const w = window.open("","_blank","width=900,height=700");

  w.document.write(`<!DOCTYPE html><html><head><title>${title}</title><style>

    h1{font-size:18px;margin-bottom:4px} .sub{font-size:12px;color:#555;margin-bottom:20px}

    .gh td{background:#f0f4fa;font-weight:700;font-size:12px;color:#0d1b2a;letter-spacing:.5px}
    .foot{margin-top:24px;font-size:11px;color:#888} @media print{body{padding:16px}}

  setTimeout(()=>{w.focus();w.print();},500);
}

function buildPrintHTML(students, courseKey, groupFilter) {
  const course = COURSES.find(c=>c.key===courseKey);
  const sorted = [...students]
    .filter(s=>{ const c=s.courses?.[courseKey]; if(!c?.group)return false; if(groupFilter&&groupFilter!=="all"&&c.group!==groupFilter)return false; return true; })
    .sort((a,b)=>{ const ga=a.courses[courseKey]?.group||"",gb=b.courses[courseKey]?.group||""; return ga!==gb?ga.localeCompare(gb,undefined,{numeric:true}):a.name.localeCompare(b.name); });
  const byGrp={};
  sorted.forEach(s=>{ const g=s.courses[courseKey].group; if(!byGrp[g])byGrp[g]=[]; byGrp[g].push(s); });
  let rows="",n=0;
  Object.entries(byGrp).forEach(([g,list])=>{
    if(groupFilter==="all") rows+=`<tr class="gh"><td colspan="6">Group ${g}</td></tr>`;
    list.forEach(s=>{ n++; rows+=`<tr><td>${n}</td><td>${s.name}</td><td>${s.indexNumber||"—"}</td><td>${s.program||"—"}</td><td><span class="g">Group ${s.courses[courseKey].group}</span></td><td>${s.courses[courseKey].topic||"—"}</td></tr>`; });
  });
  const gLabel = groupFilter&&groupFilter!=="all"?` — Group ${groupFilter}`:"";
  return { title:`${course.label} (${course.code})${gLabel}`, html:`<table><thead><tr><th>#</th><th>Full Name</th><th>Index No.</th><th>Programme</th><th>Group</th><th>Research Topic</th></tr></thead><tbody>${rows}</tbody></table>` };
}

function exportCourseXLSX(students, courseKey, groupFilter) {
  const course=COURSES.find(c=>c.key===courseKey);
  const rows=[...students]
    .filter(s=>{ const c=s.courses?.[courseKey]; if(!c?.group)return false; if(groupFilter&&groupFilter!=="all"&&c.group!==groupFilter)return false; return true; })
    .sort((a,b)=>{ const ga=a.courses[courseKey]?.group||"",gb=b.courses[courseKey]?.group||""; return ga!==gb?ga.localeCompare(gb,undefined,{numeric:true}):a.name.localeCompare(b.name); })
    .map((s,i)=>({"#":i+1,"Full Name":s.name,"Index Number":s.indexNumber||"","Programme":s.program||"","Group":s.courses[courseKey]?.group||"","Research Topic":s.courses[courseKey]?.topic||""}));
  const ws=XLSX.utils.json_to_sheet(rows);
  ws["!cols"]=[{wch:4},{wch:28},{wch:20},{wch:28},{wch:8},{wch:40}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,course.label.slice(0,31));
  const suf=groupFilter&&groupFilter!=="all"?`_Grp${groupFilter}`:"";
  XLSX.writeFile(wb,`UCC_CoDE_${course.code.replace(/\//g,"-")}${suf}.xlsx`);
}

function exportAllXLSX(students) {
  const wb=XLSX.utils.book_new();
  const master=students.map((s,i)=>{ const r={"#":i+1,"Full Name":s.name,"Index Number":s.indexNumber||"","Programme":s.program||""}; COURSES.forEach(c=>{r[`${c.code} Group`]=s.courses?.[c.key]?.group||"";r[`${c.code} Topic`]=s.courses?.[c.key]?.topic||"";}); return r; });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(master),"All Students");
  COURSES.forEach(c=>{ const rows=[...students].filter(s=>s.courses?.[c.key]?.group).sort((a,b)=>a.courses[c.key].group.localeCompare(b.courses[c.key].group,undefined,{numeric:true})||a.name.localeCompare(b.name)).map((s,i)=>({"#":i+1,"Full Name":s.name,"Index Number":s.indexNumber||"","Programme":s.program||"","Group":s.courses[c.key]?.group||"","Research Topic":s.courses[c.key]?.topic||""})); if(rows.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),c.label.slice(0,31)); });
  XLSX.writeFile(wb,"UCC_CoDE_StudentDatabase.xlsx");
}

// APP CONFIG HOOK — editable courses, programs, WhatsApp links
// ─────────────────────────────────────────────────────────────────────────────
function useAppConfig() {
  const DEFAULTS = {
    courses: COURSES.map(c=>({...c})),
    programs: [...PROGRAMS],
    whatsapp: {groups:{}, programs:{}, centers:{}}
  };
  const [cfg, setCfg] = useState(()=>{
    try { const s=localStorage.getItem("app_cfg"); return s?{...DEFAULTS,...JSON.parse(s)}:DEFAULTS; }
    catch { return DEFAULTS; }
  });
  useEffect(()=>{
    if(window.db) window.db.collection("_config").doc("app").get()
      .then(doc=>{ if(doc.exists) setCfg(prev=>({...DEFAULTS,...doc.data()})); }).catch(()=>{});
  },[]);
  const saveCfg = (updates) => {
    const merged = {...cfg, ...updates};
    setCfg(merged);
    localStorage.setItem("app_cfg", JSON.stringify(merged));
    if(window.db) window.db.collection("_config").doc("app").set(merged).catch(()=>{});
  };
  return {cfg, saveCfg};
}

// FIREBASE DATABASE LAYER
// ─────────────────────────────────────────────────────────────────────────────
function useStudents() {
  const [students,  setStudents]  = useState([]);
  const [loading,   setLoading]   = useState(true);
  const [saving,    setSaving]    = useState(false);
  const [dbMode,    setDbMode]    = useState("local"); // "firebase" | "local"

  useEffect(()=>{
    if(window.firebaseReady && window.db) {
      setDbMode("firebase");
      // Real-time listener
      const unsub = window.db.collection("students").onSnapshot(
        snap => {
          const docs = snap.docs.map(d=>({...d.data(), _docId:d.id}));
          setStudents(docs);
          setLoading(false);
        },
        err => {
          console.error("Firestore error:", err);
          // Fallback to local
          setStudents(lsGet());
          setLoading(false);
          setDbMode("local");
        }
      );
      return ()=>unsub();
    } else {
      setStudents(lsGet());
      setLoading(false);
    }
  },[]);

  const saveStudent = useCallback(async (student) => {
    setSaving(true);
    try {
      if(dbMode==="firebase" && window.db) {
        const {_docId,...data} = student;
        // Use student.id as document ID for consistent lookup
        await window.db.collection("students").doc(student.id).set(data);
        // Snapshot listener will update state automatically
      } else {
        setStudents(prev=>{
          const idx=prev.findIndex(x=>x.id===student.id);
          const next = idx>=0 ? [...prev.slice(0,idx),student,...prev.slice(idx+1)] : [...prev,student];
          lsSet(next); return next;
        });
      }
    } finally { setSaving(false); }
  }, [dbMode]);

  const deleteStudent = useCallback(async (id) => {
    setSaving(true);
    try {
      if(dbMode==="firebase" && window.db) {
        await window.db.collection("students").doc(id).delete();
      } else {
        setStudents(prev=>{ const next=prev.filter(s=>s.id!==id); lsSet(next); return next; });
      }
    } finally { setSaving(false); }
  }, [dbMode]);

  const importStudents = useCallback(async (list) => {
    if(!window.confirm(`Add ${list.length} students to the database?`)) return;
    setSaving(true);
    try {
      if(dbMode==="firebase" && window.db) {
        const batch = window.db.batch();
        list.forEach(s=>{ const ref=window.db.collection("students").doc(s.id); batch.set(ref,s); });
        await batch.commit();
      } else {
        setStudents(prev=>{ const next=[...prev,...list]; lsSet(next); return next; });
      }
    } finally { setSaving(false); }
  }, [dbMode]);


  const saveGroupTopic = useCallback(async (courseKey, groupNum, newTopic) => {
    const affected = students.filter(s => String(s.courses[courseKey]?.group) === String(groupNum));
    if (!affected.length) return;
    setSaving(true);
    try {
      const updater = s => ({...s, courses:{...s.courses,[courseKey]:{...s.courses[courseKey],topic:newTopic}}});
      if (dbMode==="firebase" && window.db) {
        for (let i=0;i<affected.length;i+=400) {
          const batch=window.db.batch();
          affected.slice(i,i+400).forEach(s=>batch.set(window.db.collection("students").doc(s.id),updater(s)));
          await batch.commit();
        }
      } else {
        setStudents(prev=>{ const next=prev.map(s=>String(s.courses[courseKey]?.group)===String(groupNum)?updater(s):s); lsSet(next); return next; });
      }
    } finally { setSaving(false); }
  }, [students, dbMode]);

  return { students, loading, saving, dbMode, saveStudent, deleteStudent, importStudents, saveGroupTopic };
}


// ─────────────────────────────────────────────────────────────────────────────
// NOTICES HOOK
// ─────────────────────────────────────────────────────────────────────────────
function useNotices() {
  const [notices, setNotices] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (window.firebaseReady && window.db) {
      const unsub = window.db.collection("_notices")
        .orderBy("createdAt", "desc")
        .onSnapshot(snap => {
          setNotices(snap.docs.map(d => ({id: d.id, ...d.data()})));
          setLoading(false);
        }, () => { setLoading(false); });
      return () => unsub();
    } else {
      try { setNotices(JSON.parse(localStorage.getItem("notices_db") || "[]")); } catch {}
      setLoading(false);
    }
  }, []);

  const saveNotice = useCallback(async (notice) => {
    const docId = notice.id || "notice_" + Date.now();
    const data = {...notice, id: docId, updatedAt: Date.now()};
    if (!data.createdAt) data.createdAt = Date.now();
    if (window.firebaseReady && window.db) {
      await window.db.collection("_notices").doc(docId).set(data);
    } else {
      setNotices(prev => {
        const idx = prev.findIndex(n => n.id === docId);
        const next = idx >= 0 ? [...prev.slice(0,idx), data, ...prev.slice(idx+1)] : [data, ...prev];
        localStorage.setItem("notices_db", JSON.stringify(next));
        return next;
      });
    }
  }, []);

  const deleteNotice = useCallback(async (id) => {
    if (window.firebaseReady && window.db) {
      await window.db.collection("_notices").doc(id).delete();
    } else {
      setNotices(prev => {
        const next = prev.filter(n => n.id !== id);
        localStorage.setItem("notices_db", JSON.stringify(next));
        return next;
      });
    }
  }, []);

  return { notices, loading, saveNotice, deleteNotice };
}


// ─────────────────────────────────────────────────────────────────────────────
// PENDING REQUESTS HOOK ("my name isn't here" holding cell)
// ─────────────────────────────────────────────────────────────────────────────
function useRequests() {
  const [requests, setRequests] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (window.firebaseReady && window.db) {
      const unsub = window.db.collection("pendingRequests")
        .orderBy("createdAt", "desc")
        .onSnapshot(snap => {
          setRequests(snap.docs.map(d => ({id: d.id, ...d.data()})));
          setLoading(false);
        }, () => { setLoading(false); });
      return () => unsub();
    } else {
      try { setRequests(JSON.parse(localStorage.getItem("pending_requests_local") || "[]")); } catch {}
      setLoading(false);
    }
  }, []);

  const submitRequest = useCallback(async (req) => {
    const docId = "req_" + Date.now() + "_" + Math.random().toString(36).slice(2,6);
    const data = {...req, id: docId, status: "pending", createdAt: Date.now()};
    if (window.firebaseReady && window.db) {
      await window.db.collection("pendingRequests").doc(docId).set(data);
    } else {
      setRequests(prev => {
        const next = [data, ...prev];
        localStorage.setItem("pending_requests_local", JSON.stringify(next));
        return next;
      });
    }
    return data;
  }, []);

  const removeRequest = useCallback(async (id) => {
    if (window.firebaseReady && window.db) {
      await window.db.collection("pendingRequests").doc(id).delete();
    } else {
      setRequests(prev => {
        const next = prev.filter(r => r.id !== id);
        localStorage.setItem("pending_requests_local", JSON.stringify(next));
        return next;
      });
    }
  }, []);

  return { requests, loading, submitRequest, removeRequest };
}


// ─────────────────────────────────────────────────────────────────────────────
// "MY NAME ISN'T HERE" — PUBLIC REQUEST MODAL (with smart detection)
// ─────────────────────────────────────────────────────────────────────────────
function RequestNameModal({onSubmit, onClose, courses, programs, students}) {
  const [name, setName] = useState("");
  const [program, setProgram] = useState(programs[0] || "");
  const [indexNumber, setIndexNumber] = useState("");
  const [phone, setPhone] = useState("");
  const [picked, setPicked] = useState([]);
  const [note, setNote] = useState("");
  const [sent, setSent] = useState(false);
  const [err, setErr] = useState("");

  // Smart detection: search for existing student by name
  const [matchedStudent, setMatchedStudent] = useState(null);
  const [searching, setSearching] = useState(false);

  useEffect(() => {
    if (name.length < 3) { setMatchedStudent(null); return; }
    setSearching(true);
    const timer = setTimeout(() => {
      const q = normName(name);
      const match = (students || []).find(s => normName(s.name) === q);
      setMatchedStudent(match || null);
      setSearching(false);
      // Pre-fill info from existing student
      if (match) {
        if (match.program) setProgram(match.program);
        if (match.indexNumber) setIndexNumber(match.indexNumber);
        if (match.phone) setPhone(match.phone);
      }
    }, 600);
    return () => clearTimeout(timer);
  }, [name, students]);

  // Filter courses: if student exists, only show courses they're NOT assigned to
  const availableCourses = useMemo(() => {
    if (!matchedStudent) return courses;
    return courses.filter(c => !matchedStudent.courses?.[c.key]?.group);
  }, [courses, matchedStudent]);

  // Courses the student already has (for display)
  const existingCourses = useMemo(() => {
    if (!matchedStudent) return [];
    return courses.filter(c => matchedStudent.courses?.[c.key]?.group);
  }, [courses, matchedStudent]);

  const toggle = (key) => setPicked(p => p.includes(key) ? p.filter(k=>k!==key) : [...p, key]);

  const submit = async () => {
    if (!name.trim()) { setErr("Please enter your full name."); return; }
    if (picked.length === 0) { setErr("Please select at least one course you're missing from."); return; }
    setErr("");
    await onSubmit({
      name: name.trim(), program, indexNumber: indexNumber.trim(), phone: phone.trim(),
      courseKeys: picked, note: note.trim(), matchedStudentId: matchedStudent?.id || null
    });
    setSent(true);
  };

  if (sent) {
      return (
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div className="modal" style={{maxWidth:420}}>
            <div className="modal-body" style={{textAlign:"center",padding:"32px 24px"}}>
              <div style={{fontSize:34,marginBottom:8}}>✅</div>
              <h2 style={{color:"var(--text)",marginBottom:8}}>Request sent</h2>
              <p className="lead">Thanks — your name has been submitted for review. Once approved you'll appear in the course list(s) you selected. No need to send another message.</p>
              <button className="btn-save" style={{marginTop:18}} onClick={onClose}>Close</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-head">
          <span className="modal-title">📝 My name isn't showing</span>
          <button className="x-btn" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="form-stack">
            <label className="lbl">Full Name <span style={{color:"var(--red)"}}>*</span></label>
            <input className="inp" value={name} onChange={e=>setName(e.target.value)} placeholder="Your full name, as it should appear"/>
            {searching && <div style={{fontSize:11,color:"var(--sub)",fontFamily:"Arial,sans-serif"}}>Searching database...</div>}
            {matchedStudent && !searching && (
              <div className="match-info">
                <b>We found you in the database!</b> Showing only courses you're not yet assigned to.
                {matchedStudent.indexNumber && <div style={{marginTop:2,color:"var(--text2)"}}>Index: {matchedStudent.indexNumber}</div>}
              </div>
            )}
            {existingCourses.length > 0 && (
              <div className="existing-courses">
                Already assigned to: {existingCourses.map(c=>c.label).join(", ")}
              </div>
            )}
            <label className="lbl">Programme</label>
            <select className="inp" value={program} onChange={e=>setProgram(e.target.value)}>
              {programs.map(p=><option key={p}>{p}</option>)}
            </select>
            <div style={{display:"flex",gap:12}}>
              <div style={{flex:1}}>
                <label className="lbl">Index Number (optional)</label>
                <input className="inp" value={indexNumber} onChange={e=>setIndexNumber(e.target.value)} placeholder="e.g. BSCIT/CR/30/25/0009"/>
              </div>
              <div style={{flex:1}}>
                <label className="lbl">Phone (optional)</label>
                <input className="inp" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="+233 XX XXX XXXX"/>
              </div>
            </div>
            <label className="lbl">Which course(s) is your name missing from? <span style={{color:"var(--red)"}}>*</span></label>
            {availableCourses.length === 0 ? (
              <div className="fully-assigned">
                <b>You're fully assigned!</b> Your name appears in all courses. If something still looks wrong, contact your admin directly.
              </div>
            ) : (
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {availableCourses.map(c=>(
                  <button key={c.key} type="button"
                    onClick={()=>toggle(c.key)}
                    className={"c-tab"+(picked.includes(c.key)?" on":"")}
                    style={{alignItems:"center",flexDirection:"row",gap:6}}>
                    {picked.includes(c.key) ? "✅ " : ""}{c.label}
                  </button>
                ))}
              </div>
            )}
            <label className="lbl">Note for the admin (optional)</label>
            <input className="inp" value={note} onChange={e=>setNote(e.target.value)} placeholder="e.g. I'm in Group 3 for this course"/>
            {err && <p className="err">{err}</p>}
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn-cancel" onClick={onClose}>Cancel</button>
          <button className="btn-save" onClick={submit} disabled={availableCourses.length === 0}>Submit Request</button>
        </div>
      </div>
    </div>
  );
}

// REP CARD + REP BOARD

function RepCard({student, role, courses, whatsapp, onNavCourse, onNavProg}) {
  const initials = student.name.split(" ").map(w=>w[0]||"").slice(0,2).join("").toUpperCase();
  const course = role.courseKey ? (courses||COURSES).find(c=>c.key===role.courseKey) : null;
  const roleName = role.label || (
    role.type==="courseRep" ? `${course?.code||""} Course Rep` :
    role.type==="centerRep" ? `Centre Rep${student.center?" — "+student.center:""}` :
    role.type==="programRep" ? "Programme Rep" :
    role.type==="groupRep" ? `Group Rep${course?" — "+course.code:""}` : "Student Rep"
  );
  const waGroup = whatsapp?.groups?.[`${role.courseKey||""}_${student.courses?.[role.courseKey]?.group||""}`];
  const waProg  = whatsapp?.programs?.[student.program||""];
  const waCentr = whatsapp?.centers?.[student.center||""];
  const waLink  = waGroup || waProg || waCentr;
  const handleClick = () => {
    if(role.type==="courseRep"&&role.courseKey&&onNavCourse) onNavCourse(role.courseKey);
    else if((role.type==="programRep"||role.type==="centerRep")&&onNavProg) onNavProg(student.program);
  };
  return (
    <div className="rep-card" onClick={handleClick} title="Click to view group/programme">
      <div className="rep-av">{initials}</div>
      <div className="rep-info">
        <div className="rep-name">{student.name}</div>

function CourseView({students, whatsapp, courses, initialCourse}){
  const activeCourses = courses || COURSES;
  const getCourseLabel = (key) => (activeCourses.find(c=>c.key===key)||COURSES.find(c=>c.key===key)||{label:key}).label;
  const getCourseCode  = (key) => (activeCourses.find(c=>c.key===key)||COURSES.find(c=>c.key===key)||{code:key}).code;
  const getWaLink = (type, key) => whatsapp?.[type]?.[key] || "";
  const [active,setActive]=useState(initialCourse||activeCourses[0]?.key||COURSES[0].key);
  const [grpFilter,setGrpFilter]=useState("all");
  const [search,setSearch]=useState("");
  useEffect(()=>{setGrpFilter("all");setSearch("");},[active]);
  useEffect(()=>{if(initialCourse)setActive(initialCourse);},[initialCourse]);
  const course=activeCourses.find(c=>c.key===active);
  const groups=useMemo(()=>{
    const gs=new Set(); students.forEach(s=>{const g=s.courses?.[active]?.group;if(g)gs.add(g);}); return["all",...[...gs].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))];
  },[students,active]);
  const visible=useMemo(()=>{
    return[...students].filter(s=>{
      const c=s.courses?.[active]; if(!c?.group)return false;
      if(grpFilter!=="all"&&c.group!==grpFilter)return false;
      if(search){const q=search.toLowerCase();return s.name.toLowerCase().includes(q)||(s.indexNumber||"").toLowerCase().includes(q)||(c.topic||"").toLowerCase().includes(q);}
      return true;
    }).sort((a,b)=>{const ga=a.courses[active].group,gb=b.courses[active].group;return ga!==gb?ga.localeCompare(gb,undefined,{numeric:true}):a.name.localeCompare(b.name);});
  },[students,active,grpFilter,search]);
  const byGrp=useMemo(()=>{const m={};visible.forEach(s=>{const g=s.courses[active].group;if(!m[g])m[g]=[];m[g].push(s);});return m;},[visible,active]);
  const doPrint=()=>{const{html,title}=buildPrintHTML(students,active,grpFilter);printTable(html,title);};
  return (
    <div>
      <div className="course-tabs-wrap">
        <div className="course-tabs">
          {activeCourses.map(c=>{
            const cnt=students.filter(s=>s.courses?.[c.key]?.group).length;
            return(
              <button key={c.key} className={"c-tab"+(active===c.key?" on":"")} onClick={()=>setActive(c.key)}>
                <span style={{fontWeight:600}}>{getCourseLabel(c.key)}</span>
                <span className="c-tab-code">{getCourseCode(c.key)}</span>
                <span className="badge">{cnt}</span>
              </button>
            );
          })}
        </div>
      </div>
      <div className="cv-controls">
        <div className="search-wrap">
          <SearchIco/>
          <input className="search-input" placeholder="Search name, index, topic…" value={search} onChange={e=>setSearch(e.target.value)}/>
          {search&&<button className="x-small" onClick={()=>setSearch("")}>✕</button>}
        </div>
        <select className="sel" value={grpFilter} onChange={e=>setGrpFilter(e.target.value)}>
          {groups.map(g=><option key={g} value={g}>{g==="all"?"All Groups":`Group ${g}`}</option>)}
        </select>
        <button className="btn-print" onClick={doPrint}><PrintIco/> Print / PDF</button>
        <button className="btn-excel" onClick={()=>exportCourseXLSX(students,active,grpFilter)}><ExcelIco/> Export Excel</button>
      </div>
      <div style={{marginBottom:16}}>
        <h2 style={{fontSize:22,color:"var(--navy)",fontWeight:700,margin:0}}>{getCourseLabel(active)} <span style={{fontSize:16,color:"var(--sub)",fontWeight:400}}>({getCourseCode(active)})</span></h2>
        <p className="lead" style={{marginTop:4}}>{grpFilter==="all"?"All Groups":`Group ${grpFilter}`} &nbsp;·&nbsp; {visible.length} student{visible.length!==1?"s":""}</p>
      </div>
      {visible.length===0
        ?<div className="empty">No students assigned to this course{grpFilter!=="all"?` in Group ${grpFilter}`:""} yet.</div>
        :(
          <div className="tbl-wrap">
            <table>
              <thead><tr><th>#</th><th>Full Name</th><th>Index No.</th><th>Programme</th><th>Group</th><th>Research Topic / Assignment</th><th>Contact</th></tr></thead>
              <tbody>
                {Object.entries(byGrp).map(([g,list])=>[
                  grpFilter==="all"&&<tr key={"h"+g} className="grp-hdr"><td colSpan={7} style={{padding:"8px 14px"}}>
                    <div className="grp-hdr-row">
                      <span style={{fontSize:12,letterSpacing:.5,fontFamily:"Arial,sans-serif"}}>Group {g}</span>
                      {getWaLink("groups",active+"_"+g)&&<a className="wa-btn sm" href={getWaLink("groups",active+"_"+g)} target="_blank" rel="noopener">💬 WhatsApp</a>}
                    </div>
                  </td></tr>,
                  ...list.map((s,i)=>(
                    <tr key={s.id} className={i%2===0?"even":""}>
                      <td>{i+1}</td><td style={{fontWeight:600}}>{s.name}</td>
                      <td>{s.indexNumber||<span className="dash">—</span>}</td>
                      <td>{s.program||<span className="dash">—</span>}</td>
                      <td><span className="grp-badge">Group {s.courses[active]?.group}</span></td>
                      <td>{s.courses[active]?.topic||<span className="dash">Not assigned</span>}</td>
                      <td style={{fontSize:11,fontFamily:"Arial,sans-serif"}}>
                        {s.phone&&<div>📞 {s.phone}</div>}

                      </td>

                  ))

            </table>
          </div>
        )
      }
    </div>
  );
}

function AdminDashboard({students}) {
  const total = students.length;
  const byCourse = COURSES.map(c=>{
    const asgn = students.filter(s=>s.courses[c.key]?.group);
    const grps = new Set(asgn.map(s=>s.courses[c.key].group));
    return {...c, assigned:asgn.length, groups:grps.size};
  });
  const fully = students.filter(s=>COURSES.every(c=>s.courses[c.key]?.group)).length;
  const progs = {};
  students.forEach(s=>{const p=s.program||"Unknown";progs[p]=(progs[p]||0)+1;});
  const progList = Object.entries(progs).sort((a,b)=>b[1]-a[1]);
  const totalGroups = byCourse.reduce((a,c)=>a+c.groups,0);
  const unassigned = total - students.filter(s=>COURSES.some(c=>s.courses[c.key]?.group)).length;
  return (
    <div>
      <div style={{marginBottom:24}}><h1>Dashboard</h1><p className="lead">Overview of the UCC CoDE student database.</p></div>
      <div className="stat-cards">
        <div className="stat-card"><div className="stat-num">{total}</div><div className="stat-label">Total Students</div></div>
        <div className="stat-card s-green"><div className="stat-num">{fully}</div><div className="stat-label">Fully Assigned</div></div>
        <div className="stat-card s-gold"><div className="stat-num">{totalGroups}</div><div className="stat-label">Total Groups</div></div>
        <div className="stat-card s-purple"><div className="stat-num">{progList.length}</div><div className="stat-label">Programmes</div></div>
        {unassigned>0&&<div className="stat-card s-red"><div className="stat-num">{unassigned}</div><div className="stat-label">Zero Assignments</div></div>}
      </div>
      <div className="dash-section">
        <h3>Course Enrollment</h3>
        {byCourse.map(c=>(
          <div key={c.key} className="bar-row">
            <div className="bar-label" title={c.label}>{c.code}</div>
            <div className="bar-track"><div className="bar-fill" style={{width:total?`${c.assigned/total*100}%`:"0%"}}/></div>
            <div className="bar-val">{c.assigned}/{total}</div>
            <div className="bar-extra">{c.groups} grp{c.groups!==1?"s":""}</div>
          </div>
        ))}
      </div>
      <div className="dash-section">
        <h3>Programme Breakdown</h3>
        {progList.map(([p,n])=>(
          <div key={p} className="bar-row">
            <div className="bar-label" title={p}>{p.replace("BSc ","").replace("BEd ","BEd ").replace("Certificate in ","Cert. ")}</div>
            <div className="bar-track"><div className="bar-fill alt" style={{width:total?`${n/total*100}%`:"0%"}}/></div>
            <div className="bar-val">{n}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// GROUPS MANAGER
// ─────────────────────────────────────────────────────────────────────────────
function GroupsManager({students, onSaveGroupTopic, onSaveStudent}) {
  const [courseKey,setCourseKey] = useState(COURSES[0].key);
  const [editing,setEditing] = useState(null);
  const [draft,setDraft] = useState("");
  const [expanded,setExpanded] = useState({});

  const course = COURSES.find(c=>c.key===courseKey);
  const grpMap = {};
  students.forEach(s=>{
    const g=s.courses[courseKey]?.group;
    if(g){
      if(!grpMap[g]) grpMap[g]={group:g,topic:s.courses[courseKey]?.topic||"",members:[]};
      grpMap[g].members.push(s);
    }
  });
  const groups = Object.values(grpMap).sort((a,b)=>Number(a.group)-Number(b.group));
  const unassigned = students.filter(s=>!s.courses[courseKey]?.group);

  const startEdit = (g) => {setEditing(g.group);setDraft(g.topic);};
  const saveTopic = async (groupNum) => { await onSaveGroupTopic(courseKey,groupNum,draft); setEditing(null); };
  const toggleExpand = (g) => setExpanded(p=>({...p,[g]:!p[g]}));

  return (
    <div>
      <div className="groups-header">
        <div><h1>Group Management</h1><p className="lead">Edit topics and view members for each course group.</p></div>
        <select className="sel" value={courseKey} onChange={e=>{setCourseKey(e.target.value);setEditing(null);setExpanded({});}}>
          {COURSES.map(c=><option key={c.key} value={c.key}>{c.label} ({c.code})</option>)}
        </select>
      </div>
      <div className="groups-meta">
        <span className="meta-pill">{groups.length} groups</span>
        <span className="meta-pill">{students.filter(s=>s.courses[courseKey]?.group).length} assigned</span>
        {unassigned.length>0&&<span className="meta-pill bad">{unassigned.length} unassigned</span>}
      </div>
      {groups.length===0
        ?<div className="empty">No group assignments for {course.label} yet. Use the Wizard to assign students.</div>
        :<div className="groups-list">
          {groups.map(g=>(
            <div key={g.group} className="group-row">
              <div className="group-row-top">
                <div className="group-num-badge">Group {g.group}</div>
                <div className="group-topic-area">
                  {editing===g.group
                    ?<div className="topic-edit-row">
                        <input className="inp sm-inp" style={{flex:1}} value={draft} onChange={e=>setDraft(e.target.value)} placeholder="Topic title…" onKeyDown={e=>{if(e.key==="Enter")saveTopic(g.group);if(e.key==="Escape")setEditing(null);}} autoFocus/>
                        <button className="btn-sm s" onClick={()=>saveTopic(g.group)}>Save</button>
                        <button className="btn-sm c" onClick={()=>setEditing(null)}>✕</button>
                      </div>
                    :<div className="topic-view-row" onClick={()=>startEdit(g)} title="Click to edit topic">
                        {g.topic?<span className="g-topic">{g.topic}</span>:<span className="no-topic">No topic — click to add</span>}
                        <span className="edit-hint">✏️ Edit</span>
                      </div>
                  }
                </div>
                <div className="group-cnt">{g.members.length} student{g.members.length!==1?"s":""}</div>
              </div>
              <button className="toggle-members" onClick={()=>toggleExpand(g.group)}>
                {expanded[g.group]?"▲ Hide members":"▼ View members"}
              </button>
              {expanded[g.group]&&(
                <ul className="member-list">
                  {g.members.sort((a,b)=>a.name.localeCompare(b.name)).map(m=>(
                    <li key={m.id}><span>{m.name}</span><span className="m-idx">{m.indexNumber}</span></li>
                  ))}
                </ul>
              )}
            </div>
          ))}
        </div>
      }
    </div>
  );
}
