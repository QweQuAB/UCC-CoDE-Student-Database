// WIZARD PANEL
// ─────────────────────────────────────────────────────────────────────────────
function WizardPanel({students, onSaveGroupTopic, onSaveStudent}) {
  const [tool,setTool] = useState(null);
  const [step,setStep] = useState(1);

  // Quick Assign state
  const [qaCourse,setQaCourse] = useState(COURSES[0].key);
  const [qaGroup,setQaGroup] = useState("");
  const [qaTopic,setQaTopic] = useState("");
  const [qaSearch,setQaSearch] = useState("");
  const [qaSelected,setQaSelected] = useState([]);
  const [qaResult,setQaResult] = useState(null);

  // Bulk Topic state
  const [btCourse,setBtCourse] = useState(COURSES[0].key);
  const [btEdits,setBtEdits] = useState({});
  const [btSaved,setBtSaved] = useState(false);

  // Find Gaps state
  const [gapCourse,setGapCourse] = useState(COURSES[0].key);

  const qaUnassigned = students
    .filter(s=>!s.courses[qaCourse]?.group && (s.name.toLowerCase().includes(qaSearch.toLowerCase())||(s.indexNumber||"").toLowerCase().includes(qaSearch.toLowerCase())))
    .sort((a,b)=>a.name.localeCompare(b.name));
  const qaExistingGroups = [...new Set(students.map(s=>s.courses[qaCourse]?.group).filter(Boolean))].sort((a,b)=>Number(a)-Number(b));

  const toggleQaSel = (id) => setQaSelected(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const selectAll = () => setQaSelected(qaUnassigned.map(s=>s.id));
  const clearSel = () => setQaSelected([]);

  const doQuickAssign = async () => {
    let done=0;
    for(const sid of qaSelected) {
      const s=students.find(st=>st.id===sid);
      if(!s)continue;
      const updated={...s,courses:{...s.courses,[qaCourse]:{group:String(qaGroup),topic:qaTopic}}};
      await onSaveStudent(updated);
      done++;
    }
    setQaResult(done);
    setStep(4);
  };

  const btGroups = React.useMemo(()=>[...new Set(students.map(s=>s.courses[btCourse]?.group).filter(Boolean))]
    .sort((a,b)=>Number(a)-Number(b))
    .map(g=>{
      const sample=students.find(s=>s.courses[btCourse]?.group===g);
      return {group:g,topic:btEdits[g]!==undefined?btEdits[g]:(sample?.courses[btCourse]?.topic||""),count:students.filter(s=>s.courses[btCourse]?.group===g).length};
    }),[students,btCourse,btEdits]);

  const doBulkTopics = async () => {
    for(const [g,t] of Object.entries(btEdits)) await onSaveGroupTopic(btCourse,g,t);
    setBtEdits({});setBtSaved(true);
  };

  const gapStudents = students.filter(s=>!s.courses[gapCourse]?.group).sort((a,b)=>a.name.localeCompare(b.name));

  const reset = () => {setTool(null);setStep(1);setQaSelected([]);setQaSearch("");setQaGroup("");setQaTopic("");setQaResult(null);setBtEdits({});setBtSaved(false);};

  if(!tool) return (
    <div>
      <div style={{marginBottom:24}}><h1>Wizard</h1><p className="lead">Accelerate repetitive tasks with guided tools.</p></div>
      <div className="wizard-tools">
        <div className="wizard-tool" onClick={()=>{setTool("qa");setStep(1);}}>
          <div className="tool-icon">⚡</div>
          <div className="tool-title">Quick Assign</div>
          <div className="tool-desc">Assign multiple unassigned students to a group in any course in one go.</div>
        </div>
        <div className="wizard-tool" onClick={()=>{setTool("bt");setStep(1);}}>
          <div className="tool-icon">✏️</div>
          <div className="tool-title">Bulk Edit Topics</div>
          <div className="tool-desc">Edit all group topics for a course on one screen — no clicking around.</div>
        </div>
        <div className="wizard-tool" onClick={()=>{setTool("gaps");setStep(1);}}>
          <div className="tool-icon">🔍</div>
          <div className="tool-title">Find Unassigned</div>
          <div className="tool-desc">Instantly see which students have no group for any course.</div>
        </div>
      </div>
    </div>
  );

  // QUICK ASSIGN ─────────────────────────────────────────────────────────────
  if(tool==="qa") {
    const steps=["Course","Group","Students","Done"];
    const stepBar = (
      <div className="step-bar">
        {steps.map((l,i)=>(
          <React.Fragment key={l}>
            <div className={"s-dot"+(step>i+1?" done":step===i+1?" active":"")}>{step>i+1?"✓":i+1}</div>
            {i<steps.length-1&&<div className={"s-line"+(step>i+1?" done":"")}/>}
          </React.Fragment>
        ))}
      </div>
    );
    return (
      <div className="wiz-shell">
        <div className="wiz-hdr">
          <span className="wiz-title">⚡ Quick Assign Wizard</span>
          <button className="wiz-back" onClick={reset}>← Back to Tools</button>
        </div>
        <div className="wiz-body">
          {stepBar}
          {step===1&&(
            <div>
              <label className="lbl">Select Course</label>
              <p className="lead" style={{marginBottom:12}}>Which course do you want to assign students to?</p>
              <select className="inp" value={qaCourse} onChange={e=>setQaCourse(e.target.value)}>
                {COURSES.map(c=><option key={c.key} value={c.key}>{c.label} ({c.code})</option>)}
              </select>
              <p className="lead" style={{marginTop:8}}>{students.filter(s=>!s.courses[qaCourse]?.group).length} students currently unassigned in this course.</p>
              <div className="wiz-actions"><button className="btn-next" onClick={()=>setStep(2)}>Next →</button></div>
            </div>
          )}
          {step===2&&(
            <div>
              <label className="lbl">Select or Create Group</label>
              <p className="lead" style={{marginBottom:12}}>Type a group number. Existing groups shown below.</p>
              <input className="inp" value={qaGroup} onChange={e=>setQaGroup(e.target.value)} placeholder="e.g. 8"/>
              {qaExistingGroups.length>0&&<div style={{marginTop:10,display:"flex",gap:6,flexWrap:"wrap"}}>
                {qaExistingGroups.map(g=><button key={g} className={"grp-badge"} style={{cursor:"pointer",border:qaGroup===g?"2px solid var(--teal)":"2px solid transparent"}} onClick={()=>setQaGroup(g)}>Group {g}</button>)}
              </div>}
              <label className="lbl" style={{marginTop:14,display:"block"}}>Topic (optional)</label>
              <input className="inp" value={qaTopic} onChange={e=>setQaTopic(e.target.value)} placeholder="Group topic…"/>
              <div className="wiz-actions">
                <button className="btn-cancel" onClick={()=>setStep(1)}>← Back</button>
                <button className="btn-next" disabled={!qaGroup.trim()} onClick={()=>setStep(3)}>Next →</button>
              </div>
            </div>
          )}
          {step===3&&(
            <div>
              <label className="lbl">Select Students to Assign to Group {qaGroup}</label>
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <input className="inp sm-inp" style={{flex:1}} placeholder="Search name or index…" value={qaSearch} onChange={e=>setQaSearch(e.target.value)}/>
                <button className="btn-sm s" onClick={selectAll}>All</button>
                <button className="btn-sm c" onClick={clearSel}>None</button>
              </div>
              {qaUnassigned.length===0?<div className="empty" style={{padding:"30px 0"}}>No unassigned students match.</div>
                :<div className="pick-list">
                  {qaUnassigned.map(s=>(
                    <div key={s.id} className={"pick-item"+(qaSelected.includes(s.id)?" sel":"")} onClick={()=>toggleQaSel(s.id)}>
                      <span>{qaSelected.includes(s.id)?"☑":"☐"}</span>
                      <span className="pick-name">{s.name}</span>
                      <span className="pick-idx">{s.indexNumber}</span>
                    </div>
                  ))}
                </div>
              }
              <p style={{fontSize:12,color:"var(--sub)",fontFamily:"Arial,sans-serif",marginTop:8}}>{qaSelected.length} selected</p>
              <div className="wiz-actions">
                <button className="btn-cancel" onClick={()=>setStep(2)}>← Back</button>
                <button className="btn-next" disabled={qaSelected.length===0||!qaGroup} onClick={doQuickAssign}>Assign {qaSelected.length} Students →</button>
              </div>
            </div>
          )}
          {step===4&&(
            <div className="success-box">
              <div className="s-icon">✅</div>
              <div className="s-msg">{qaResult} student{qaResult!==1?"s":""} assigned to Group {qaGroup}!</div>
              <div className="s-sub">They now appear under {COURSES.find(c=>c.key===qaCourse)?.label} → Group {qaGroup}.</div>
              <div style={{marginTop:24,display:"flex",gap:12,justifyContent:"center"}}>
                <button className="btn-cancel" onClick={()=>{setStep(1);setQaSelected([]);setQaResult(null);}}>Assign More</button>
                <button className="btn-next" onClick={reset}>← Back to Tools</button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  // BULK TOPIC ────────────────────────────────────────────────────────────────
  if(tool==="bt") return (
    <div className="wiz-shell">
      <div className="wiz-hdr">
        <span className="wiz-title">✏️ Bulk Edit Topics</span>
        <button className="wiz-back" onClick={reset}>← Back to Tools</button>
      </div>
      <div className="wiz-body">
        <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:16,flexWrap:"wrap"}}>
          <label className="lbl">Course:</label>
          <select className="sel" value={btCourse} onChange={e=>{setBtCourse(e.target.value);setBtEdits({});setBtSaved(false);}}>
            {COURSES.map(c=><option key={c.key} value={c.key}>{c.label} ({c.code})</option>)}
          </select>
          <span style={{color:"var(--sub)",fontSize:12,fontFamily:"Arial,sans-serif"}}>{btGroups.length} groups</span>
        </div>
        {btGroups.length===0?<div className="empty">No groups assigned for this course yet.</div>
          :<React.Fragment>
            <p className="lead" style={{marginBottom:12}}>Edit any topic below. Changes are saved when you click Save All.</p>
            <div className="bulk-topic-grid">
              {btGroups.map(g=>(
                <div key={g.group} className="bt-row">
                  <div className="bt-grp">Grp {g.group}</div>
                  <input className="bt-inp" value={g.topic} onChange={e=>setBtEdits(p=>({...p,[g.group]:e.target.value}))} placeholder="Topic…"/>
                  <div className="bt-cnt">{g.count} student{g.count!==1?"s":""}</div>
                </div>
              ))}
            </div>
            {btSaved&&<p className="msg-ok" style={{marginTop:10}}>✅ All topics saved successfully!</p>}
            <div className="wiz-actions">
              <button className="btn-cancel" onClick={reset}>Cancel</button>
              <button className="btn-next" disabled={Object.keys(btEdits).length===0} onClick={doBulkTopics}>Save All Topics</button>
            </div>
          </React.Fragment>
        }
      </div>
    </div>
  );

  // FIND GAPS ─────────────────────────────────────────────────────────────────
  if(tool==="gaps") return (
    <div className="wiz-shell">
      <div className="wiz-hdr">
        <span className="wiz-title">🔍 Find Unassigned Students</span>
        <button className="wiz-back" onClick={reset}>← Back to Tools</button>
      </div>
      <div className="wiz-body">
        <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:16,flexWrap:"wrap"}}>
          <label className="lbl">Course:</label>
          <select className="sel" value={gapCourse} onChange={e=>setGapCourse(e.target.value)}>
            {COURSES.map(c=><option key={c.key} value={c.key}>{c.label} ({c.code})</option>)}
          </select>
        </div>
        {gapStudents.length===0
          ?<div className="success-box"><div className="s-icon">🎉</div><div className="s-msg">All students assigned!</div><div className="s-sub">Every student has a group assignment for {COURSES.find(c=>c.key===gapCourse)?.label}.</div></div>
          :<React.Fragment>
            <p className="lead" style={{marginBottom:12}}><b>{gapStudents.length}</b> student{gapStudents.length!==1?"s":""} with no group assignment for {COURSES.find(c=>c.key===gapCourse)?.label}:</p>
            <div className="pick-list" style={{maxHeight:400}}>
              {gapStudents.map(s=>(
                <div key={s.id} className="pick-item" style={{cursor:"default"}}>
                  <span className="pick-name">{s.name}</span>
                  <span className="pick-idx">{s.indexNumber}</span>
                  <span style={{fontSize:11,color:"var(--sub)",fontFamily:"Arial,sans-serif"}}>{s.program?.replace("BSc ","").replace("Certificate in ","Cert. ")||""}</span>
                </div>
              ))}
            </div>
          </React.Fragment>
        }
      </div>
    </div>
  );

  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// SETTINGS PANEL
// ─────────────────────────────────────────────────────────────────────────────
function SettingsPanel({settings, onSaveSettings, adminPassword, onPasswordChange, students, onDeleteAll, cfg, onSaveCfg}) {
  const [settingsTab, setSettingsTab] = useState("appearance");

  /* ── Appearance ── */
  const [form,    setForm]    = useState({...settings});
  const [saveMsg, setSaveMsg] = useState("");
  const upd = (k,v) => setForm(p=>({...p,[k]:v}));
  const handleSaveAppearance = () => {
    onSaveSettings(form);
    setSaveMsg("✅ Saved!"); setTimeout(()=>setSaveMsg(""),3000);
  };

  /* ── Password ── */
  const [pwd,    setPwd]    = useState({cur:"",nw:"",cf:""});
  const [pwdMsg, setPwdMsg] = useState("");
  const handlePwd = () => {
    if (pwd.cur !== adminPassword) { setPwdMsg("Current password incorrect."); return; }
    if (pwd.nw.length < 4)         { setPwdMsg("Min 4 characters."); return; }
    if (pwd.nw !== pwd.cf)         { setPwdMsg("Passwords do not match."); return; }
    onPasswordChange(pwd.nw);
    setPwd({cur:"",nw:"",cf:""});
    setPwdMsg("✅ Password changed!"); setTimeout(()=>setPwdMsg(""),4000);
  };

  /* ── Courses — LOCAL editable copy ── */
  const [localCourses, setLocalCourses] = useState(()=>(cfg?.courses||COURSES).map(c=>({...c})));
  const [courseMsg,    setCourseMsg]    = useState("");
  React.useEffect(()=>{ setLocalCourses((cfg?.courses||COURSES).map(c=>({...c}))); },[cfg?.courses]);
  const saveCourses = () => {
    onSaveCfg({courses:localCourses});
    setCourseMsg("✅ Courses saved!"); setTimeout(()=>setCourseMsg(""),3000);
  };

  /* ── Programs — LOCAL editable copy ── */
  const [localProgs, setLocalProgs] = useState(()=>[...(cfg?.programs||PROGRAMS)]);
  const [progMsg,    setProgMsg]    = useState("");
  React.useEffect(()=>{ setLocalProgs([...(cfg?.programs||PROGRAMS)]); },[cfg?.programs]);
  const saveProgs = () => {
    onSaveCfg({programs:localProgs});
    setProgMsg("✅ Programmes saved!"); setTimeout(()=>setProgMsg(""),3000);
  };

  /* ── WhatsApp — LOCAL editable copy ── */
  const [localWa,  setLocalWa]  = useState(()=>JSON.parse(JSON.stringify(cfg?.whatsapp||{groups:{},programs:{},centers:{}})));
  const [waMsg,    setWaMsg]    = useState("");
  const [waAccOpen, setWaAccOpen] = useState({});
  React.useEffect(()=>{ setLocalWa(JSON.parse(JSON.stringify(cfg?.whatsapp||{groups:{},programs:{},centers:{}}))); },[cfg?.whatsapp]);
  const setWaField = (type, key, val) => setLocalWa(prev=>({...prev,[type]:{...prev[type],[key]:val}}));
  const saveWa = () => {
    onSaveCfg({whatsapp:localWa});
    setWaMsg("✅ WhatsApp links saved!"); setTimeout(()=>setWaMsg(""),3000);
  };
  const toggleWaAcc = (key) => setWaAccOpen(prev=>({...prev,[key]:!prev[key]}));

  const centres = [...new Set(students.map(s=>s.center).filter(Boolean))].sort();

  const SETTINGS_TABS = [
    ["appearance","🎨 Appearance"],
    ["courses","📚 Courses & Programmes"],
    ["whatsapp","💬 WhatsApp Links"],
    ["security","🔐 Security"],
    ["system","📊 System"],
  ];

  return (
    <div className="settings-page">
      <div style={{marginBottom:24}}><h1>Settings</h1><p className="lead">Customise the portal, manage courses and programmes, configure WhatsApp links, and change your password.</p></div>

      <div className="settings-tabs">
        {SETTINGS_TABS.map(([k,l])=>(
          <button key={k} className={"settings-tab"+(settingsTab===k?" on":"")} onClick={()=>setSettingsTab(k)}>{l}</button>
        ))}
      </div>

      {/* ── APPEARANCE ── */}
      {settingsTab==="appearance"&&(
        <div className="settings-section">
          <div className="set-sec">
            <h3>🎨 Portal Appearance</h3>
            <p className="s-desc">Customise the header title and accent colours shown across the student portal.</p>
            <div className="set-row">
              <div><div className="set-lbl">Portal Title</div><div className="set-sub">Shown in the header</div></div>
              <input className="inp" style={{maxWidth:260}} value={form.portalTitle||""} onChange={e=>upd("portalTitle",e.target.value)}/>
            </div>
            <div className="set-row">
              <div><div className="set-lbl">Portal Subtitle</div></div>
              <input className="inp" style={{maxWidth:260}} value={form.portalSub||""} onChange={e=>upd("portalSub",e.target.value)}/>
            </div>
            <div className="set-row">
              <div><div className="set-lbl">Accent Colour</div><div className="set-sub">Nav, tables, buttons</div></div>
              <div className="color-row">
                <div className="color-preview" style={{background:form.accentColor||"#00d4ff"}}/>
                <input type="color" className="inp" style={{width:70,padding:3}} value={form.accentColor||"#00d4ff"} onChange={e=>upd("accentColor",e.target.value)}/>
              </div>
            </div>
            <div className="set-row">
              <div><div className="set-lbl">Highlight / Gold</div><div className="set-sub">Badges, add button</div></div>
              <div className="color-row">
                <div className="color-preview" style={{background:form.goldColor||"#f0a500"}}/>
                <input type="color" className="inp" style={{width:70,padding:3}} value={form.goldColor||"#f0a500"} onChange={e=>upd("goldColor",e.target.value)}/>
              </div>
            </div>
            <div className="set-row">
              <div><div className="set-lbl">Header Background</div></div>
              <div className="color-row">
                <div className="color-preview" style={{background:form.navyColor||"#0a0f1e"}}/>
                <input type="color" className="inp" style={{width:70,padding:3}} value={form.navyColor||"#0a0f1e"} onChange={e=>upd("navyColor",e.target.value)}/>
              </div>
            </div>
            <div style={{marginTop:14}}>
              <div style={{fontSize:12,color:"var(--sub)",fontFamily:"Arial,sans-serif",marginBottom:6}}>Preview</div>
              <div className="preview-hdr" style={{background:form.navyColor||"#0a0f1e"}}>
                <div className="preview-mk" style={{background:form.goldColor||"#f0a500",color:form.navyColor||"#0a0f1e"}}>{(form.portalTitle||"UCC").substring(0,3).toUpperCase()}</div>
                <div><div className="preview-title">{form.portalTitle||"UCC CoDE"}</div><div className="preview-sub">{form.portalSub||"BSc IT & BEd IT · Student Database"}</div></div>
              </div>
            </div>
            {saveMsg&&<p className="msg-ok" style={{marginTop:10}}>{saveMsg}</p>}
            <div className="set-save-row"><button className="btn-save" onClick={handleSaveAppearance}>Save Appearance</button></div>
          </div>
        </div>
      )}

      {/* ── COURSES & PROGRAMMES ── */}
      {settingsTab==="courses"&&(
        <div className="settings-section">
          <div className="set-sec">
            <h3>📚 Course Management</h3>
            <p className="s-desc">Edit course display names and codes, then click Save. Changes apply app-wide.</p>
            <table className="edit-table">
              <thead><tr><th>Course Name</th><th style={{width:110}}>Code</th></tr></thead>
              <tbody>
                {localCourses.map((c,i)=>(
                  <tr key={c.key}>
                    <td><input className="et-inp" value={c.label} onChange={e=>{const n=[...localCourses];n[i]={...n[i],label:e.target.value};setLocalCourses(n);}}/></td>
                    <td><input className="et-inp" value={c.code}  onChange={e=>{const n=[...localCourses];n[i]={...n[i],code:e.target.value};setLocalCourses(n);}}/></td>
                  </tr>
                ))}
              </tbody>
            </table>
            {courseMsg&&<p className="msg-ok" style={{marginTop:8}}>{courseMsg}</p>}
            <div className="set-save-row"><button className="btn-save" onClick={saveCourses}>Save Courses</button></div>
          </div>

          <div className="set-sec">
            <h3>🎓 Programme Management</h3>
            <p className="s-desc">Edit, add, or remove programme names, then click Save.</p>
            <table className="edit-table">
              <thead><tr><th>Programme Name</th><th style={{width:36}}></th></tr></thead>
              <tbody>
                {localProgs.map((p,i)=>(
                  <tr key={i}>
                    <td><input className="et-inp" value={p} onChange={e=>{const n=[...localProgs];n[i]=e.target.value;setLocalProgs(n);}}/></td>
                    <td><button className="et-btn-del" onClick={()=>setLocalProgs(localProgs.filter((_,j)=>j!==i))}>✕</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
            <button className="et-btn-add" onClick={()=>setLocalProgs([...localProgs,"New Programme"])}>+ Add Programme</button>
            {progMsg&&<p className="msg-ok" style={{marginTop:8}}>{progMsg}</p>}
            <div className="set-save-row"><button className="btn-save" onClick={saveProgs}>Save Programmes</button></div>
          </div>
        </div>
      )}

      {/* ── WHATSAPP LINKS ── */}
      {settingsTab==="whatsapp"&&(
        <div className="settings-section">
          <div className="set-sec">
            <h3>💬 WhatsApp Group Links</h3>
            <p className="s-desc">Paste invite links for course groups, programmes, and study centres. Click Save when done. Links appear as buttons on student and rep cards throughout the portal.</p>

            <div className="wa-sec-hdr">Course Groups (click to expand)</div>
            {localCourses.map(c=>{
              const grps=[...new Set(students.map(s=>s.courses[c.key]?.group).filter(Boolean))].sort((a,b)=>Number(a)-Number(b));
              if(!grps.length) return null;
              const accKey = "course_"+c.key;
              const isOpen = waAccOpen[accKey];
              const filledCount = grps.filter(g=>(localWa.groups||{})[c.key+"_"+g]).length;
              return (
                <div key={c.key} style={{marginBottom:4}}>
                  <div className={"acc-header"+(isOpen?" open":"")} onClick={()=>toggleWaAcc(accKey)}>
                    <span className={"acc-chevron"+(isOpen?" open":"")}>▶</span>
                    <span className="acc-title">{c.label} ({c.code})</span>
                    <span className="acc-count">{filledCount}/{grps.length} linked</span>
                  </div>
                  {isOpen&&(
                    <div className="acc-body">
                      {grps.map(g=>(
                        <div key={g} className="wa-inp-row">
                          <div className="wa-inp-label">Group {g}</div>
                          <input className={"wa-inp"+((localWa.groups||{})[c.key+"_"+g]?" filled":"")} placeholder="https://chat.whatsapp.com/..." value={(localWa.groups||{})[c.key+"_"+g]||""} onChange={e=>setWaField("groups",c.key+"_"+g,e.target.value)}/>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}

            <div className="wa-sec-hdr" style={{marginTop:20}}>Programmes</div>
            {localProgs.map(p=>(
              <div key={p} className="wa-inp-row">
                <div className="wa-inp-label">{p.replace("BSc ","").replace("Certificate in ","Cert. ").substring(0,22)}</div>
                <input className={"wa-inp"+((localWa.programs||{})[p]?" filled":"")} placeholder="https://chat.whatsapp.com/..." value={(localWa.programs||{})[p]||""} onChange={e=>setWaField("programs",p,e.target.value)}/>
              </div>
            ))}

            <div className="wa-sec-hdr" style={{marginTop:20}}>Study Centres</div>
            {centres.length===0
              ? <p style={{fontSize:12,color:"var(--sub)",fontFamily:"Arial,sans-serif"}}>No centres set yet — add a Study Centre on any student's profile to unlock this.</p>
              : centres.map(c=>(
                  <div key={c} className="wa-inp-row">
                    <div className="wa-inp-label">{c.substring(0,22)}</div>
                    <input className={"wa-inp"+((localWa.centers||{})[c]?" filled":"")} placeholder="https://chat.whatsapp.com/..." value={(localWa.centers||{})[c]||""} onChange={e=>setWaField("centers",c,e.target.value)}/>
                  </div>
                ))
            }
            {waMsg&&<p className="msg-ok" style={{marginTop:8}}>{waMsg}</p>}
            <div className="set-save-row"><button className="btn-save" style={{background:"#25D366"}} onClick={saveWa}>💾 Save WhatsApp Links</button></div>
          </div>
        </div>
      )}

      {/* ── SECURITY ── */}
      {settingsTab==="security"&&(
        <div className="settings-section">
          <div className="set-sec">
            <h3>🔐 Change Admin Password</h3>
            <p className="s-desc">Update the admin panel password. Minimum 4 characters.</p>
            <div className="pwd-fields">
              <input type="password" className="inp" placeholder="Current password" value={pwd.cur} onChange={e=>setPwd(p=>({...p,cur:e.target.value}))}/>
              <input type="password" className="inp" placeholder="New password"     value={pwd.nw}  onChange={e=>setPwd(p=>({...p,nw:e.target.value}))}/>
              <input type="password" className="inp" placeholder="Confirm new password" value={pwd.cf} onChange={e=>setPwd(p=>({...p,cf:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&handlePwd()}/>
            </div>
            {pwdMsg&&<p className={pwdMsg.startsWith("✅")?"msg-ok":"msg-err"}>{pwdMsg}</p>}
            <button className="btn-save" style={{marginTop:14}} onClick={handlePwd}>Change Password</button>
          </div>
        </div>
      )}

      {/* ── SYSTEM ── */}
      {settingsTab==="system"&&(
        <div className="settings-section">
          <div className="set-sec">
            <h3>📊 Database Info</h3>
            <p className="s-desc">Current storage status.</p>
            <div className="set-row"><div className="set-lbl">Storage</div><span className={window.firebaseReady?"badge-ok":"badge-warn"}>{window.firebaseReady?"● Firebase Cloud":"● Local Browser"}</span></div>
            <div className="set-row"><div className="set-lbl">Students</div><span style={{fontWeight:700,fontFamily:"Arial,sans-serif"}}>{students.length}</span></div>
            <div className="set-row"><div className="set-lbl">Firebase Project</div><span style={{fontSize:12,fontFamily:"Arial,sans-serif",color:"var(--sub)"}}>{window.firebaseReady?"database-ucc-it":"Not connected"}</span></div>
          </div>

          <div className="set-sec set-danger">
            <h3>⚠️ Danger Zone</h3>
            <p className="s-desc">These actions are irreversible.</p>
            <div className="set-row">
              <div><div className="set-lbl">Clear Entire Database</div><div className="set-sub">Permanently deletes all {students.length} student records</div></div>
              <button className="btn-danger" onClick={()=>{if(window.confirm(`Delete ALL ${students.length} student records? This CANNOT be undone.`))onDeleteAll();}}>Delete All Records</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
        {waMsg&&<p className="msg-ok" style={{marginTop:8}}>{waMsg}</p>}
        <div className="set-save-row"><button className="btn-save" style={{background:"#25D366"}} onClick={saveWa}>💾 Save WhatsApp Links</button></div>
      </div>

      {/* ── SECURITY ── */}
      <div className="set-sec">
        <h3>🔐 Change Admin Password</h3>
        <p className="s-desc">Update the admin panel password. Minimum 4 characters.</p>
        <div className="pwd-fields">

  const cat = notice.category || "general";
  const date = notice.createdAt ? new Date(notice.createdAt).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "";

// ─────────────────────────────────────────────────────────────────────────────
// REQUESTS ADMIN — the holding-cell / duplicate-check queue (with group override)
// ─────────────────────────────────────────────────────────────────────────────
function RequestsAdmin({requests, students, courses, onApprove, onReject}) {
  const [busy, setBusy] = useState(null);
  const [groupOverrides, setGroupOverrides] = useState({}); // { "requestKey_courseKey": "2" }

  // Find the smallest group for a given course
  const findSmallestGroup = useCallback((courseKey) => {
    const groupCounts = {};
    students.forEach(s => {
      const g = s.courses?.[courseKey]?.group;
      if (g) groupCounts[g] = (groupCounts[g] || 0) + 1;
    });
    if (Object.keys(groupCounts).length === 0) return "1";
    return String(Object.entries(groupCounts).sort((a,b) => a[1] - b[1])[0][0]);
  }, [students]);

  // Get existing groups for a course (for dropdown)
  const getExistingGroups = useCallback((courseKey) => {
    const groups = new Set();
    students.forEach(s => {
      const g = s.courses?.[courseKey]?.group;
      if (g) groups.add(g);
    });
    return [...groups].sort((a,b) => Number(a) - Number(b));
  }, [students]);

  // Group requests by normalized name so duplicate submissions surface together
  const groups = useMemo(() => {
    const byName = {};
    requests.filter(r=>r.status!=="rejected").forEach(r => {
      const key = normName(r.name);
      if (!byName[key]) byName[key] = [];
      byName[key].push(r);
    });
    return Object.entries(byName).map(([key, list]) => {
      const match = students.find(s => normName(s.name) === key);
      // union of all course keys requested across duplicate submissions
      const allCourseKeys = [...new Set(list.flatMap(r => r.courseKeys||[]))];
      // Auto-assign smallest group for each course
      const autoGroups = {};
      allCourseKeys.forEach(ck => { autoGroups[ck] = findSmallestGroup(ck); });
      return { key, list, match, allCourseKeys, isDup: list.length > 1, autoGroups };
    }).sort((a,b) => (b.list[0].createdAt||0) - (a.list[0].createdAt||0));
  }, [requests, students, findSmallestGroup]);

  const getGroupOverride = (reqKey, courseKey) => {
    return groupOverrides[reqKey + "_" + courseKey] || "";
  };

  const setGroupOverride = (reqKey, courseKey, val) => {
    setGroupOverrides(prev => ({...prev, [reqKey + "_" + courseKey]: val}));
  };

  const approve = async (group) => {
    setBusy(group.key);
    try {
      // Build group overrides map
      const overrides = {};
      group.allCourseKeys.forEach(ck => {
        const override = getGroupOverride(group.key, ck);
        overrides[ck] = override || group.autoGroups[ck];
      });
      await onApprove(group, overrides);
    } finally { setBusy(null); }
  };

  const rejectOne = async (req) => {
    setBusy(req.id);
    try { await onReject(req); } finally { setBusy(null); }
  };

  if (groups.length === 0) return <div className="empty">No pending requests. When a student flags a missing name, it'll show up here.</div>;

  return (
    <div>
      <div style={{marginBottom:18}}><h1>Pending Requests</h1><p className="lead">{groups.length} name{groups.length!==1?"s":""} awaiting review — approving auto-fills their name into the selected course(s) with the smallest group. Override group numbers below if needed.</p></div>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {groups.map(g => (
          <div key={g.key} className="card" style={{padding:16}}>
            <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
              <div style={{flex:1,minWidth:280}}>
                <div style={{fontWeight:700,fontSize:15}}>
                  {g.list[0].name}
                  {g.isDup && <span className="badge" style={{marginLeft:8,background:"#fdeaea",color:"var(--red)"}}>{g.list.length} duplicate submissions</span>}
                  {g.match && <span className="badge" style={{marginLeft:8,background:"#e8f4fd",color:"var(--teal)"}}>Existing student: "{g.match.name}"</span>}
                </div>
                <div className="card-sub" style={{marginTop:4}}>
                  {g.list[0].program || "—"}{g.list[0].indexNumber ? " · "+g.list[0].indexNumber : ""}{g.list[0].phone ? " · "+g.list[0].phone : ""}
                </div>
                {g.list.some(r=>r.note) && (
                  <div style={{marginTop:6,fontSize:12,fontStyle:"italic",color:"var(--sub)"}}>
                    {g.list.filter(r=>r.note).map((r,i)=><div key={i}>"{r.note}"</div>)}
                  </div>
                )}
                {/* Group override controls */}
                <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:6}}>
                  <div style={{fontSize:11,fontWeight:700,color:"var(--navy)",fontFamily:"Arial,sans-serif",textTransform:"uppercase",letterSpacing:".5px"}}>Course Assignments</div>
                  {g.allCourseKeys.map(ck => {
                    const c = courses.find(x=>x.key===ck);
                    const autoGroup = g.autoGroups[ck];
                    const override = getGroupOverride(g.key, ck);
                    const effective = override || autoGroup;
                    const existing = getExistingGroups(ck);
                    return (
                      <div key={ck} style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                        <span className="grp-badge" style={{minWidth:140}}>{c ? c.label : ck}</span>
                        <span style={{fontSize:11,color:"var(--sub)",fontFamily:"Arial,sans-serif"}}>Group</span>
                        <select
                          value={effective}
                          onChange={e => setGroupOverride(g.key, ck, e.target.value)}
                          style={{padding:"4px 8px",border:"1px solid var(--border)",borderRadius:5,fontSize:12,fontFamily:"Arial,sans-serif",background:"var(--surface)",color:"var(--text)"}}
                        >
                          {existing.map(grp => <option key={grp} value={grp}>Group {grp}</option>)}
                          <option value={autoGroup}>Group {autoGroup} (auto)</option>
                        </select>
                        {override && override !== autoGroup && (
                          <span style={{fontSize:10,color:"var(--gold)",fontFamily:"Arial,sans-serif",fontWeight:700}}>overridden</span>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                <button className="btn-save" disabled={busy===g.key} onClick={()=>approve(g)}>
                  {busy===g.key ? "Working..." : (g.match ? "Merge & Approve" : "Approve & Add")}
                </button>
                {g.list.map(r => (
                  <button key={r.id} className="btn-del" disabled={busy===r.id} onClick={()=>rejectOne(r)} title={g.isDup?"Reject this submission":"Reject"}>
                    {g.isDup ? "Reject one" : "Reject"}
                  </button>
                ))}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AdminPanel({students,onAdd,onEdit,onDelete,onImport,onSaveStudent,onSaveGroupTopic,settings,onSaveSettings,adminPassword,onPasswordChange,onDeleteAll,cfg,onSaveCfg,onSaveMeta,onSaveWaLinks,notices,onSaveNotice,onDeleteNotice,requests,onApproveRequest,onRejectRequest}){

    const reader=new FileReader();

      const ws=wb.Sheets[wb.SheetNames[0]];

      const list=rows.map(r=>{
        const s=emptyStudent();

        return s;
      }).filter(s=>s.name.trim());
      onImport(list);fileRef.current.value="";
    };

  };

  const handleSeed = async () => {
    const newOnes = SEED_STUDENTS.filter(s => !students.some(ex => ex.indexNumber === s.indexNumber));
    const skipped = SEED_STUDENTS.length - newOnes.length;
    if (newOnes.length === 0) { alert(`All ${skipped} students are already in the database. Nothing to load.`); return; }
    if (!window.confirm(`Load ${newOnes.length} students into Firebase?${skipped > 0 ? `\n(${skipped} already exist and will be skipped.)` : ""}`)) return;
    try {
      if (window.db) {
        const chunkSize = 400;
        for (let i = 0; i < newOnes.length; i += chunkSize) {
          const chunk = newOnes.slice(i, i + chunkSize);
          const batch = window.db.batch();
          chunk.forEach(s => { const ref = window.db.collection("students").doc(s.id); batch.set(ref, s); });
          await batch.commit();
        }
        alert(`✅ Done! ${newOnes.length} students loaded into Firebase.`);
      } else { onImport(newOnes); }

                      <td style={{color:"var(--sub)",fontSize:11}}>{i+1}</td>
                      <td style={{fontWeight:600}}>{s.name}</td>
                      <td style={{fontFamily:"monospace",fontSize:12}}>{s.indexNumber||<span className="dash">—</span>}</td>
                      <td style={{fontSize:12}}>{s.program||<span className="dash">—</span>}</td>
                      <td>
                        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                          {COURSES.filter(c=>s.courses[c.key]?.group).map(c=>(
                            <span key={c.key} className="grp-badge" title={c.label}>{c.code} G{s.courses[c.key].group}</span>
                          ))}
                          {COURSES.filter(c=>s.courses[c.key]?.group).length===0&&<span className="dash">—</span>}
                        </div>
                      </td>
                      <td>
                        <div style={{display:"flex",gap:6}}>
                          <button className="btn-edit" onClick={()=>onEdit(s)}>✏️</button>
                          {delConfirm===s.id
                            ?<React.Fragment><button className="btn-del" onClick={()=>{onDelete(s.id);setDelConfirm(null);}}>Confirm</button><button className="btn-cancel" style={{padding:"4px 8px",fontSize:12}} onClick={()=>setDelConfirm(null)}>Cancel</button></React.Fragment>
                            :<button className="btn-del" onClick={()=>setDelConfirm(s.id)}>🗑️</button>
                          }
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {adminTab==="groups"&&<GroupsManager students={students} onSaveGroupTopic={onSaveGroupTopic} onSaveStudent={onSaveStudent}/>}
      {adminTab==="wizard"&&<WizardPanel students={students} onSaveGroupTopic={onSaveGroupTopic} onSaveStudent={onSaveStudent}/>}
      {adminTab==="requests"&&<RequestsAdmin requests={requests||[]} students={students} courses={cfg.courses||COURSES} onApprove={onApproveRequest} onReject={onRejectRequest}/>}
      {adminTab==="notices"&&<NoticesAdmin notices={notices||[]} onSave={onSaveNotice} onDelete={onDeleteNotice}/>}
            {adminTab==="settings"&&<SettingsPanel settings={settings} onSaveSettings={onSaveSettings} adminPassword={adminPassword} onPasswordChange={onPasswordChange} students={students} onDeleteAll={onDeleteAll} cfg={cfg} onSaveCfg={onSaveCfg}/>}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// APP
// ─────────────────────────────────────────────────────────────────────────────
function App(){
  const {students,loading,saving,dbMode,saveStudent,deleteStudent,importStudents,saveGroupTopic} = useStudents();
  const {notices, loading: noticesLoading, saveNotice, deleteNotice} = useNotices();
  const {requests, submitRequest, removeRequest} = useRequests();
  const appCfg = useAppConfig();
  const activeCourses = appCfg.cfg.courses || COURSES;
  const activePrograms = appCfg.cfg.programs || PROGRAMS;
  const [view,setView]=useState(()=>{
    const params=new URLSearchParams(window.location.search);
    return params.has("admin")?"login":"portal";
  });
  const [authed,setAuthed]=useState(false);
  const [authChecking,setAuthChecking]=useState(!!(window.firebaseReady&&window.auth));
  const [pw,setPw]=useState("");
  const [email,setEmail]=useState("");
  const [pwErr,setPwErr]=useState("");
  const [modal,setModal]=useState(null);
  const [requestModalOpen,setRequestModalOpen]=useState(false);
  const [search,setSearch]=useState("");
  const [progFilter,setProgFilter]=useState("all");
  const [courseNav,setCourseNav]=useState(null);
  const [mobileMenu,setMobileMenu]=useState(false);
  const [detailStudent,setDetailStudent]=useState(null);
  const [lightTheme,setLightTheme]=useState(()=>localStorage.getItem("theme")==="light");

  // Dynamic admin password (legacy local-mode fallback only — see handleLogin)
  const [adminPassword,setAdminPassword] = useState(()=>localStorage.getItem("admin_pw")||"StAnne2025");

  // Real Firebase Auth session (used whenever Firebase is configured)
  useEffect(()=>{
    if(window.firebaseReady && window.auth){
      const unsub = window.auth.onAuthStateChanged(user=>{
        const ok = !!user && ADMIN_EMAILS.includes((user.email||"").toLowerCase());
        setAuthed(ok);
        setAuthChecking(false);
        if(!ok && user) window.auth.signOut();
        // Auto-redirect to admin if ?admin in URL and just authenticated
        if(ok && new URLSearchParams(window.location.search).has("admin")) setView("admin");
      });
      return ()=>unsub();
    }
  },[]);

  // Portal appearance settings
  const DEFAULT_SETTINGS = {portalTitle:"UCC CoDE",portalSub:"BSc IT \u0026 BEd IT \u00b7 Group \u0026 Assignment Tracker",accentColor:"#00d4ff",goldColor:"#f0a500",navyColor:"#0a0f1e"};
  const [portalSettings,setPortalSettings] = useState(()=>{
    try{const s=localStorage.getItem("portal_cfg");return s?{...DEFAULT_SETTINGS,...JSON.parse(s)}:DEFAULT_SETTINGS;}
    catch{return DEFAULT_SETTINGS;}
  });

  const handleSaveMeta = (meta) => {
    _displayMeta = meta;
    localStorage.setItem("display_meta", JSON.stringify(meta));
  };
  const handleSaveWaLinks = (wa) => {
    _waLinks = wa;
    localStorage.setItem("wa_links", JSON.stringify(wa));
  };

  const applySettings = useCallback((s)=>{
    document.documentElement.style.setProperty("--accent",s.accentColor||"#00d4ff");
    document.documentElement.style.setProperty("--teal",s.accentColor||"#00d4ff");
    document.documentElement.style.setProperty("--gold",s.goldColor||"#f0a500");
    document.documentElement.style.setProperty("--navy",s.navyColor||"#0a0f1e");
  },[]);

  useEffect(()=>applySettings(portalSettings),[portalSettings]);

  const toggleTheme = useCallback(()=>{
    setLightTheme(prev=>{
      const next = !prev;
      localStorage.setItem("theme", next?"light":"dark");
      return next;
    });
  },[]);

  useEffect(()=>{
    document.body.classList.toggle("light", lightTheme);
  },[lightTheme]);

  // Header scroll shadow
  useEffect(()=>{
    const onScroll=()=>{const h=document.querySelector('.hdr');if(h){if(window.scrollY>20)h.classList.add('scrolled');else h.classList.remove('scrolled');}};
    window.addEventListener('scroll',onScroll,{passive:true});return()=>window.removeEventListener('scroll',onScroll);
  },[]);

  const handleSaveSettings = (s)=>{
    setPortalSettings(s);
    localStorage.setItem("portal_cfg",JSON.stringify(s));
    applySettings(s);
  };
  const handlePasswordChange = (p)=>{setAdminPassword(p);localStorage.setItem("admin_pw",p);};
  const handleDeleteAll = useCallback(async ()=>{
    if(window.db){
      const snap=await window.db.collection("students").get();
      const batch=window.db.batch();
      snap.docs.forEach(d=>batch.delete(d.ref));
      await batch.commit();
    } else { localStorage.removeItem("students_db"); }
  },[]);

  const handleSave=useCallback(async s=>{await saveStudent(s);setModal(null);},[saveStudent]);

  const handleLogin=async ()=>{
    if(window.firebaseReady && window.auth){
      setPwErr("");
      try{
        await window.auth.signInWithEmailAndPassword(email.trim(), pw);
        setView("admin"); setPw("");
      }catch(e){ setPwErr("Login failed: "+(e.message||"check your email/password.")); }
    } else {
      // Local-mode fallback (Firebase not configured)
      if(pw===adminPassword){setAuthed(true);setPwErr("");setView("admin");setPw("");}else setPwErr("Incorrect password.");
    }
  };
  const handleLogout=()=>{
    if(window.firebaseReady && window.auth) window.auth.signOut();
    setAuthed(false); setView("portal");
    window.history.replaceState({},'',window.location.pathname);
  };

  // ── Approve / reject "my name isn't here" requests ──
  const handleApproveRequest = useCallback(async (group, groupOverrides) => {
    // If student exists, merge; otherwise create new
    const target = group.match
      ? JSON.parse(JSON.stringify(group.match))
      : {...emptyStudent(), name: group.list[0].name, program: group.list[0].program||"", indexNumber: group.list[0].indexNumber||"", phone: group.list[0].phone||""};

    // Fill basic info from submission (always update from latest submission)
    target.name = group.list[0].name;
    if (group.list[0].program) target.program = group.list[0].program;
    if (group.list[0].indexNumber) target.indexNumber = group.list[0].indexNumber;
    if (group.list[0].phone) target.phone = group.list[0].phone;

    // Add each requested course with the group from overrides (or auto-assigned)
    group.allCourseKeys.forEach(ck => {
      if (!target.courses[ck]) target.courses[ck] = {group:"", topic:""};
      // Only set group if not already assigned (never overwrite existing groups)
      if (!target.courses[ck].group) {
        target.courses[ck].group = groupOverrides?.[ck] || "1";
      }
    });

    await saveStudent(target);
    for (const r of group.list) await removeRequest(r.id);
  }, [saveStudent, removeRequest]);

  const handleRejectRequest = useCallback(async (req) => {
    await removeRequest(req.id);
  }, [removeRequest]);

  const handleSubmitRequest = useCallback(async (req) => {
    await submitRequest(req);
  }, [submitRequest]);

  const portalList=useMemo(()=>{
    let l=[...students];
    if(search){const q=search.toLowerCase();l=l.filter(s=>s.name.toLowerCase().includes(q)||(s.indexNumber||"").toLowerCase().includes(q)||Object.values(s.courses||{}).some(c=>(c.group||"").toLowerCase().includes(q)||(c.topic||"").toLowerCase().includes(q)));}
    if(progFilter!=="all")l=l.filter(s=>s.program===progFilter);
    return l.sort((a,b)=>a.name.localeCompare(b.name));
  },[students,search,progFilter]);

  if(loading) return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",background:"var(--bg)",gap:16}}>
      <div style={{color:"var(--accent)",fontSize:24,fontFamily:"var(--font)",fontWeight:800,letterSpacing:"-0.03em"}}>UCC CoDE</div>
      <div style={{color:"var(--text3)",fontSize:14,fontFamily:"var(--mono)"}}>Loading Student Database…</div>
      <div style={{width:40,height:40,border:"3px solid var(--border)",borderTopColor:"var(--accent)",borderRadius:"50%",animation:"spin .6s linear infinite"}}></div>
    </div>
  );

  return (
    <React.Fragment>
      <header className="hdr">
        <div className="hdr-inner">
          <div className="logo">
            <div className="logo-mk">{(portalSettings.portalTitle||"UCC").substring(0,3).toUpperCase()}</div>
            <div>
              <div className="logo-title">{portalSettings.portalTitle||"UCC CoDE"}</div>
              <div className="logo-sub">{portalSettings.portalSub||"BSc IT & BEd IT · Group & Assignment Tracker"}</div>
            </div>
          </div>
          <nav>
            {[["portal","🎓 Student Portal"],["noticeboard","📋 Noticeboard"],["courses","📚 Course Views"]].map(([v,l])=>(
              <button key={v} className={"nav-btn"+(view===v?" on":"")} onClick={()=>setView(v)}>{l}</button>
            ))}
            <button className="nav-btn" onClick={toggleTheme} title="Toggle light/dark theme" style={{padding:"8px 10px"}}>{lightTheme?"🌙":"☀️"}</button>
            {authed&&<button className="logout-btn" onClick={handleLogout}>Sign Out</button>}
          </nav>
          <button className="hamburger" onClick={()=>setMobileMenu(p=>!p)}>{mobileMenu?"✕":"☰"}</button>
        </div>
        <div className={"mobile-nav"+(mobileMenu?" open":"")}>
          {[["portal","🎓 Student Portal"],["noticeboard","📋 Noticeboard"],["courses","📚 Course Views"]].map(([v,l])=>(
            <button key={v} className={"nav-btn"+(view===v?" on":"")} onClick={()=>{setView(v);setMobileMenu(false);}}>{l}</button>
          ))}
          <button className="nav-btn" onClick={()=>{toggleTheme();setMobileMenu(false);}} style={{gap:7}}>{lightTheme?"🌙 Dark Mode":"☀️ Light Mode"}</button>
          {authed&&<button className="logout-btn" onClick={()=>{handleLogout();setMobileMenu(false);}}>Sign Out</button>}
        </div>
        <div className="stripe"/>
      </header>

      <main>
        {!window.firebaseReady && (
          <div className="config-notice">
            <h3>\u26a0\ufe0f Firebase Not Configured \u2014 Running in Local Mode</h3>
            <p>Data is currently saving to this browser only. To enable the cloud database (so all classmates can see updates), open <code>index.html</code> in a text editor, find the <code>firebaseConfig</code> section, and replace the placeholder values with your Firebase project credentials.</p>
            <p style={{marginTop:8}}>See setup instructions at the top of the HTML file, or ask your IT admin (JB IT Solutions) to configure it.</p>
          </div>
        )}

        {view==="portal" && (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",flexWrap:"wrap",gap:12,marginBottom:24}}>
              <div><h1>Student Groups &amp; Assignments</h1><p className="lead">Find your name, group number, and research topic for each course. Click a card to view details.</p></div>
              <button className="btn-add" onClick={()=>setRequestModalOpen(true)}>📝 My name isn't here</button>
            </div>
            {(()=>{const reps=portalList.filter(s=>s.role?.type);return reps.length>0&&(
              <div className="reps-section">
                <div className="reps-section-hdr">
                  <h2>★ Leadership</h2>
                  <span className="badge">{reps.length} representative{reps.length!==1?"s":""}</span>
                </div>
                <div className="reps-grid">
                  {reps.map(s=><RepCard key={s.id} student={s} onViewCourse={(key,grp)=>{setCourseNav({courseKey:key,group:grp});setView("courses");}}/>)}
                </div>
              </div>
            )})()}
            <RepBoard students={students} courses={activeCourses} whatsapp={appCfg.cfg.whatsapp}
              onNavCourse={ck=>{ setCourseNav(ck); setView("courses"); }}
              onNavProg={pg=>{ setProgFilter(pg||"all"); }}
            />
            <div className="filter-bar">
              <div className="search-wrap">
                <SearchIco/>
                <input className="search-input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name, group, topic"/>
                {search&&<button className="x-small" onClick={()=>setSearch("")}>\u2715</button>}
              </div>
              <select className="sel" value={progFilter} onChange={e=>setProgFilter(e.target.value)}>
                <option value="all">All Programmes</option>
                {activePrograms.map(p=><option key={p}>{p}</option>)}
              </select>
            </div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
              <p className="stat" style={{margin:0}}><b>{portalList.length}</b> of <b>{students.length}</b> students shown</p>
              {progFilter!=="all"&&appCfg.cfg.whatsapp?.programs?.[progFilter]&&(
                <a href={appCfg.cfg.whatsapp.programs[progFilter]} target="_blank" rel="noopener noreferrer" className="wa-btn">💬 {progFilter.replace("BSc ","").replace("Certificate in ","Cert. ").replace("BEd ","")} WhatsApp</a>
              )}
            </div>
            {portalList.length===0?<div className="empty">No students match your search.</div>:<div className="card-grid">{portalList.map(s=><StudentCard key={s.id} student={s} whatsapp={appCfg.cfg.whatsapp} onView={()=>setDetailStudent(s)}/>)}</div>}
          </div>
        )}

        {view==="courses" && <CourseView students={students} whatsapp={appCfg.cfg.whatsapp} courses={activeCourses} initialCourse={courseNav}/>}

        {view==="noticeboard" && <Noticeboard notices={notices} loading={noticesLoading}/>}

        {view==="login" && (
          <div className="login-wrap">
            <div className="login-card">
              <div className="grid-bg"/>
              <div style={{textAlign:"center",color:"var(--accent)",marginBottom:4,position:"relative",zIndex:1}}><LockIco s={22}/></div>
              <h2 style={{margin:0,textAlign:"center",color:"var(--text)",fontSize:20,position:"relative",zIndex:1}}>Admin Access</h2>
              <p className="lead" style={{textAlign:"center",position:"relative",zIndex:1}}>{window.firebaseReady?"Sign in with your admin account.":"Enter the administrator password."}</p>
              {window.firebaseReady && (
                <input type="email" className="inp" placeholder="Admin email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()} style={{position:"relative",zIndex:1}}/>
              )}
              <input type="password" className="inp" placeholder="Password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()} style={{position:"relative",zIndex:1}}/>
              {pwErr&&<p className="err">{pwErr}</p>}
              <button className="btn-save" style={{width:"100%",position:"relative",zIndex:1}} onClick={handleLogin}>Login</button>
            </div>
          </div>
        )}

        {view==="admin" && authed && (
          <AdminPanel
            students={students}
            onAdd={()=>setModal(emptyStudent())}
            onEdit={s=>setModal(JSON.parse(JSON.stringify(s)))}
            onDelete={deleteStudent}
            onImport={importStudents}
            onSaveStudent={saveStudent}
            onSaveGroupTopic={saveGroupTopic}
            settings={portalSettings}
            onSaveSettings={handleSaveSettings}
            adminPassword={adminPassword}
            onPasswordChange={handlePasswordChange}
            onDeleteAll={handleDeleteAll}
            cfg={appCfg.cfg}
            onSaveCfg={appCfg.saveCfg}
            onSaveMeta={handleSaveMeta}
            onSaveWaLinks={handleSaveWaLinks}
            notices={notices}
            onSaveNotice={saveNotice}
            onDeleteNotice={deleteNotice}
            requests={requests}
            onApproveRequest={handleApproveRequest}
            onRejectRequest={handleRejectRequest}
          />
        )}
      </main>

      {modal && <StudentModal student={modal} onSave={handleSave} onClose={()=>setModal(null)} courses={appCfg.cfg.courses||COURSES}/>}
      {requestModalOpen && <RequestNameModal onSubmit={handleSubmitRequest} onClose={()=>setRequestModalOpen(false)} courses={activeCourses} programs={activePrograms} students={students}/>}

      {detailStudent && <StudentDetailModal student={detailStudent} whatsapp={appCfg.cfg.whatsapp} onClose={()=>setDetailStudent(null)}/>}

      {authed && view!=="login" && view!=="admin" && (
        <button className="fab-admin" onClick={()=>setView("admin")} title="Return to Admin Panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          Admin
        </button>
      )}

      {saving && (
        <div className="saving-toast">
          <span className="spinner"/>
          Saving to {window.firebaseReady?"Firebase cloud":"local storage"}
        </div>
      )}

      <footer>
        UCC CoDE Level 100 IT Group Database <span style={{color:window.firebaseReady?"var(--accent3)":"var(--gold)"}}>{window.firebaseReady?"\u25cf Firebase Cloud Active":"\u25cf Local Mode (Firebase not configured)"}</span>
      </footer>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
